services:
  - type: web
    name: league-hub
    runtime: docker
    plan: free            # sleeps after ~15 min idle; data lives in the external Postgres below
    rootDir: league-hub
    branch: app-v2
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL     # postgresql://... from Neon/Supabase (free tiers)
        sync: false
      - key: PUBLIC_BASE_URL  # e.g. https://league-hub.onrender.com
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false

/* ---------------------------------------------------------
   Ranking engine — mirrors the workbook's Rankings_Engine /
   Scarcity_Engine formula chain for THIS league's roster settings,
   so projections can be refreshed at any time and everything
   recomputes live. Player identity is the NAME string (stable
   across recomputes, so existing pick references never break).
---------------------------------------------------------- */
function tierFor(vbd) {
  if (vbd >= 150) return "Tier 1";
  if (vbd >= 100) return "Tier 2";
  if (vbd >= 60) return "Tier 3";
  if (vbd >= 30) return "Tier 4";
  return "Tier 5";
}

function computeRankings(base) {
  const players = base.map((p) => ({ ...p }));
  const byPos = {};
  players.forEach((p) => {
    if (!byPos[p.position]) byPos[p.position] = [];
    byPos[p.position].push(p);
  });
  Object.keys(byPos).forEach((pos) => {
    byPos[pos].sort((a, b) => b.points - a.points);
    byPos[pos].forEach((p, i) => {
      p.posRank = i + 1;
    });
  });

  const replValue = {};
  Object.keys(REPL_RANK).forEach((pos) => {
    const list = byPos[pos] || [];
    const rank = REPL_RANK[pos];
    const idx = Math.min(rank, list.length) - 1;
    replValue[pos] = idx >= 0 ? list[idx].points : 0;
  });

  players.forEach((p) => {
    p.vbd = p.points - (replValue[p.position] ?? 0);
    p.tier = tierFor(p.vbd);
  });

  const scarcityD = {};
  Object.keys(STARTERS_REQ).forEach((pos) => {
    const list = byPos[pos] || [];
    const B = STARTERS_REQ[pos];
    const top = list.filter((p) => p.posRank <= B);
    const sum = top.reduce((s, p) => s + p.vbd, 0);
    scarcityD[pos] = B > 0 ? sum / B : 0;
  });
  const mult = {};
  Object.keys(STARTERS_REQ).forEach((pos) => {
    const d = scarcityD[pos];
    if (pos === "K") mult[pos] = 0.01 + d * 0.25;
    else if (pos === "DEF") mult[pos] = 0.1 + d * 0.25;
    else mult[pos] = 1 + d * 0.25;
  });
  // K/DEF scarcity gets dampened further on top of the base formula above —
  // both positions are deep and replaceable all season, so their scarcity
  // value shouldn't compete with skill positions late in the draft.
  const SCARCITY_DAMPEN = { TE: 0.65, K: 0.15, DEF: 0.15 };
  const belowReplacementAnchor = Math.max(...players.map((p) => p.points), 0) + 1;
  players.forEach((p) => {
    // Only amplify/dampen VBD that's actually above replacement level. Applying
    // a position multiplier to a NEGATIVE VBD inverts its intent — a bigger
    // multiplier on a "less bad" number can end up more negative than a small
    // multiplier on a "more bad" number, which is exactly how deep bench players
    // at scarce-but-thin positions were sneaking ahead of players with real,
    // meaningful point projections. Below replacement, VBD is still relative
    // to each position's own replacement baseline, which can make a 0-point
    // player at a thin position (e.g. TE) look "less bad" than a mediocre
    // player at a deep one (e.g. WR) purely from differing baselines — not
    // what "low point projection" should mean. So below replacement, rank on
    // raw points instead (shifted to stay below every above-replacement
    // score), which puts 0-point players at the true bottom regardless of
    // position, and still keeps every above-replacement player ranked ahead
    // of every below-replacement one.
    p.scarcity =
      p.vbd > 0
        ? p.vbd * (mult[p.position] ?? 1) * (SCARCITY_DAMPEN[p.position] ?? 1)
        : p.points - belowReplacementAnchor;
  });


  // Overall Rank: pure projected-points ranking, no scarcity involved at all.
  const byPoints = [...players].sort((a, b) => b.points - a.points);
  byPoints.forEach((p, i) => {
    p.overallRank = i + 1;
  });

  // Scarcity Ranking: a re-ranking driven by scarcity value (VBD adjusted for
  // positional scarcity) rather than raw points — this is a genuinely different
  // ordering from Overall Rank, since a position-scarce player can rank above
  // a higher-scoring player at a deeper position. Calibrated toward real
  // draft-day behavior: blend the scarcity-based rank with the historical
  // average pick used at that position + position-rank over past drafts. More
  // years of consistent history = more trust in the real number; no history
  // (deep bench, or a league with no data loaded) keeps the pure scarcity rank.
  const byScarcity = [...players].sort((a, b) => b.scarcity - a.scarcity);
  byScarcity.forEach((p, i) => {
    p.prelimScarcityRank = i + 1;
  });
  players.forEach((p) => {
    const h = HISTORICAL_ADP[p.position] && HISTORICAL_ADP[p.position][p.posRank];
    if (!h) {
      p.scarcityBlendScore = p.prelimScarcityRank;
      return;
    }
    const [histAvgPick, , years] = h;
    const weight = years >= 3 ? 0.5 : years === 2 ? 0.4 : 0.3;
    p.scarcityBlendScore = p.prelimScarcityRank * (1 - weight) + histAvgPick * weight;
  });

  // Safety net: within a position, a lower-projected player should never end up
  // with a better (lower) blended scarcity score than a higher-projected player
  // at the same position — clamp any inversions the historical ADP blend (based
  // on real but small-sample pick data) might otherwise introduce.
  Object.keys(byPos).forEach((pos) => {
    const list = byPos[pos]; // already sorted desc by points, with posRank assigned
    for (let i = 1; i < list.length; i++) {
      if (list[i].scarcityBlendScore < list[i - 1].scarcityBlendScore) {
        list[i].scarcityBlendScore = list[i - 1].scarcityBlendScore;
      }
    }
  });

  // Second safety net: the historical-pick blend mixes rank-space numbers with
  // real pick numbers, which can (rarely) let a below-replacement player's
  // blended score cross above an above-replacement player's — every
  // above-replacement player should still rank ahead of every below-replacement
  // one. Shift the whole below-replacement bucket down uniformly if needed,
  // which preserves relative order within it while restoring the boundary.
  const aboveScores = players.filter((p) => p.vbd > 0).map((p) => p.scarcityBlendScore);
  const belowScores = players.filter((p) => p.vbd <= 0).map((p) => p.scarcityBlendScore);
  if (aboveScores.length > 0 && belowScores.length > 0) {
    const aboveMax = Math.max(...aboveScores);
    const belowMin = Math.min(...belowScores);
    if (belowMin <= aboveMax) {
      const shift = aboveMax - belowMin + 1;
      players.forEach((p) => {
        if (p.vbd <= 0) p.scarcityBlendScore += shift;
      });
    }
  }

  const finalScarcityRanked = [...players].sort((a, b) => {
    if (a.scarcityBlendScore !== b.scarcityBlendScore) return a.scarcityBlendScore - b.scarcityBlendScore;
    return b.points - a.points; // tie-break: the clamp above can equalize scores, so break ties by points
  });
  finalScarcityRanked.forEach((p, i) => {
    p.scarcityRank = i + 1;
  });

  return players.map((p) => ({
    id: p.name,
    name: p.name,
    position: p.position,
    points: p.points,
    vbd: p.vbd,
    tier: p.tier,
    scarcity: p.scarcity,
    overallRank: p.overallRank,
    scarcityRank: p.scarcityRank,
    bye: BYE_WEEKS[p.position === "DEF" ? p.name : p.name.split(" ").slice(-1)[0]] ?? null,
  }));
}

/* ---------------------------------------------------------
   Starting lineup assignment — given a team's drafted entries, fills
   required slots with the highest-points eligible player at each,
   then FLEX, leaving the rest on the bench. Shared by the Team
   Rosters and Draft Analysis views.
---------------------------------------------------------- */
function buildLineup(entries, players, req) {
  const withData = entries
    .map((e) => ({ ...e, player: players.find((p) => p.id === e.playerId) }))
    .filter((e) => e.player);

  const used = new Set();
  const takeBest = (positions) => {
    const candidates = withData.filter((e) => positions.includes(e.player.position) && !used.has(e.playerId));
    candidates.sort((a, b) => b.player.points - a.player.points);
    return candidates[0] || null;
  };

  const slots = [];
  ["QB", "RB", "WR", "TE", "K", "DEF"].forEach((pos) => {
    const count = req[pos] || 0;
    for (let i = 0; i < count; i++) {
      const best = takeBest([pos]);
      if (best) used.add(best.playerId);
      slots.push({ label: `${pos}${i + 1}`, entry: best });
    }
  });
  for (let i = 0; i < (req.FLEX || 0); i++) {
    const best = takeBest(FLEX_ELIGIBLE);
    if (best) used.add(best.playerId);
    slots.push({ label: `FLEX${i + 1}`, entry: best });
  }

  const POSITION_ORDER = { QB: 0, RB: 1, WR: 2, TE: 3, K: 4, DEF: 5 };
  const bench = withData
    .filter((e) => !used.has(e.playerId))
    .sort((a, b) => {
      const posDiff = (POSITION_ORDER[a.player.position] ?? 9) - (POSITION_ORDER[b.player.position] ?? 9);
      if (posDiff !== 0) return posDiff;
      return b.player.points - a.player.points;
    });

  const starterPoints = slots.reduce((s, sl) => s + (sl.entry ? sl.entry.player.points : 0), 0);

  return { slots, bench, starterPoints };
}

/* ---------------------------------------------------------
   Snake draft order helper
---------------------------------------------------------- */
function teamOnClock(order, pickIndex) {
  const n = order.length;
  const round = Math.floor(pickIndex / n);
  const posInRound = pickIndex % n;
  const roundOrder = round % 2 === 0 ? order : [...order].slice().reverse();
  return roundOrder[posInRound];
}

/* ---------------------------------------------------------
   CSV helpers (projections import, results export)
---------------------------------------------------------- */
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map((h) => h.trim().replace(/^"|"$/g, "").toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(",").map((c) => c.trim().replace(/^"|"$/g, ""));
    const row = {};
    headers.forEach((h, idx) => {
      row[h] = cells[idx];
    });
    rows.push(row);
  }
  return rows;
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------
   Persistence helpers
---------------------------------------------------------- */
async function loadState() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    /* no saved state yet, or storage unavailable */
  }
  return null;
}
async function saveState(state) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    /* best effort */
  }
}

/* ---------------------------------------------------------
   Root component
---------------------------------------------------------- */
function App() {
  const [ready, setReady] = useState(false);
  const [stage, setStage] = useState("setup"); // setup | draft
  const [teams, setTeams] = useState(
    DEFAULT_TEAM_NAMES.map((name, i) => ({ id: i, name }))
  );
  const [order, setOrder] = useState(DEFAULT_TEAM_NAMES.map((_, i) => i));
  const [picks, setPicks] = useState([]); // {playerId, teamId, pickNum}
  const [players, setPlayers] = useState(() => computeRankings(DEFAULT_BASE));
  const [projMsg, setProjMsg] = useState("");
  const [myTeamId, setMyTeamId] = useState(null);

  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      const saved = await loadState();
      if (saved) {
        setStage(saved.stage || "setup");
        if (saved.teams) setTeams(saved.teams);
        if (saved.order) setOrder(saved.order);
        if (saved.picks) setPicks(saved.picks);
        if (saved.playerBase) setPlayers(computeRankings(saved.playerBase));
        if (saved.myTeamId !== undefined) setMyTeamId(saved.myTeamId);
      }
      setReady(true);
    })();
    // eslint-disable-next-line
  }, []);

  useEffect(() => {
    if (!ready) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveState({
        stage,
        teams,
        order,
        picks,
        playerBase: players.map((p) => ({ name: p.name, position: p.position, points: p.points })),
        myTeamId,
      });
    }, 300);
    return () => clearTimeout(saveTimer.current);
  }, [ready, stage, teams, order, picks, players, myTeamId]);

  const handleUpdateProjections = useCallback(
    (file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rows = parseCSV(String(e.target.result));
          if (rows.length === 0) {
            setProjMsg("Couldn't find any data rows in that file.");
            return;
          }
          const headers = Object.keys(rows[0]);
          const playerKey = headers.find((h) => h.includes("player") || h === "name");
          const pointsKey = headers.find((h) => h.includes("point"));
          const positionKey = headers.find((h) => h.includes("position") || h === "pos");
          if (!playerKey || !pointsKey) {
            setProjMsg('Need a column with "player" in the header and one with "points".');
            return;
          }
          const draftedIds = new Set(picks.map((p) => p.playerId));
          const knownNames = new Set(players.map((p) => p.name));
          const csvNames = new Set(); // every name that appeared in the upload
          const updates = {}; // name -> points, for players already in the pool
          const newPlayers = []; // {name, position, points} for names not yet in the pool
          const seenNew = new Set();
          let skippedNoPosition = 0;

          rows.forEach((r) => {
            const name = (r[playerKey] || "").trim();
            const pts = parseFloat(r[pointsKey]);
            if (!name || !Number.isFinite(pts)) return;
            csvNames.add(name);
            if (knownNames.has(name)) {
              updates[name] = pts;
              return;
            }
            const rawPos = positionKey ? (r[positionKey] || "").trim().toUpperCase() : "";
            if (POSITIONS.includes(rawPos)) {
              if (!seenNew.has(name)) {
                seenNew.add(name);
                newPlayers.push({ name, position: rawPos, points: pts });
              }
            } else {
              skippedNoPosition++;
            }
          });

          // Full replace: anyone not in the new file gets dropped from the pool —
          // except a player who's already been drafted, since removing them would
          // corrupt existing rosters/picks that reference them.
          let removed = 0;
          let keptAnyway = 0;
          const base = [];
          players.forEach((p) => {
            if (csvNames.has(p.name)) {
              base.push({
                name: p.name,
                position: p.position,
                points: Object.prototype.hasOwnProperty.call(updates, p.name) ? updates[p.name] : p.points,
              });
            } else if (draftedIds.has(p.id)) {
              keptAnyway++;
              base.push({ name: p.name, position: p.position, points: p.points });
            } else {
              removed++;
            }
          });
          base.push(...newPlayers);

          setPlayers(computeRankings(base));

          const matched = Object.keys(updates).length;
          let msg = `Updated ${matched} player${matched === 1 ? "" : "s"}.`;
          if (newPlayers.length > 0) {
            msg += ` Added ${newPlayers.length} new player${newPlayers.length === 1 ? "" : "s"}.`;
          }
          if (removed > 0) {
            msg += ` Removed ${removed} player${removed === 1 ? "" : "s"} not on the new list.`;
          }
          if (keptAnyway > 0) {
            msg += ` Kept ${keptAnyway} already-drafted player${
              keptAnyway === 1 ? "" : "s"
            } that weren't on the new list — can't drop a player once they're rostered.`;
          }
          if (skippedNoPosition > 0) {
            msg += ` ${skippedNoPosition} row${skippedNoPosition === 1 ? "" : "s"} couldn't be added — include a "Position" column (QB/RB/WR/TE/K/DEF) to add new players.`;
          }
          setProjMsg(msg);
        } catch (err) {
          setProjMsg("Couldn't read that file — make sure it's a CSV export.");
        }
      };
      reader.readAsText(file);
    },
    [players, picks]
  );

  const [addPlayerMsg, setAddPlayerMsg] = useState("");
  const handleAddCustomPlayer = useCallback(
    (name, position) => {
      const trimmed = name.trim();
      if (!trimmed) {
        setAddPlayerMsg("Enter a player name.");
        return;
      }
      if (players.some((p) => p.name.toLowerCase() === trimmed.toLowerCase())) {
        setAddPlayerMsg(`"${trimmed}" is already in the player pool.`);
        return;
      }
      const base = players.map((p) => ({ name: p.name, position: p.position, points: p.points }));
      base.push({ name: trimmed, position, points: 0 });
      setPlayers(computeRankings(base));
      setAddPlayerMsg(`Added ${trimmed} (${position}) at 0 projected points.`);
    },
    [players]
  );

  const handleSaveFile = useCallback(() => {
    const payload = {
      savedAt: new Date().toISOString(),
      teams,
      order,
      picks,
      playerBase: players.map((p) => ({ name: p.name, position: p.position, points: p.points })),
      myTeamId,
    };
    downloadBlob(JSON.stringify(payload, null, 2), `${STORAGE_KEY}-save.json`, "application/json");
  }, [teams, order, picks, players, myTeamId]);

  const handleLoadFile = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(String(e.target.result));
        if (data.teams) setTeams(data.teams);
        if (data.order) setOrder(data.order);
        setPicks(data.picks || []);
        if (data.playerBase) setPlayers(computeRankings(data.playerBase));
        setMyTeamId(data.myTeamId !== undefined ? data.myTeamId : null);
        setStage(data.picks && data.picks.length > 0 ? "draft" : "setup");
      } catch (err) {
        window.alert("Couldn't read that file — is it a save file from this tool?");
      }
    };
    reader.readAsText(file);
  }, []);

  const handleExportResults = useCallback(() => {
    const rows = [["Round", "Pick", "Overall", "Team", "Player", "Position"]];
    const teamsCount = order.length || teams.length;
    picks
      .slice()
      .sort((a, b) => a.pickNum - b.pickNum)
      .forEach((pk) => {
        const p = players.find((pp) => pp.id === pk.playerId);
        const t = teams.find((tt) => tt.id === pk.teamId);
        const round = Math.floor((pk.pickNum - 1) / teamsCount) + 1;
        const pickInRound = ((pk.pickNum - 1) % teamsCount) + 1;
        rows.push([round, pickInRound, pk.pickNum, t?.name || "", p?.name || "", p?.position || ""]);
      });
    const csv = rows
      .map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    downloadBlob(csv, `${STORAGE_KEY}-results.csv`, "text/csv");
  }, [picks, players, teams, order]);

  const handleClearAll = useCallback(async () => {
    setTeams(DEFAULT_TEAM_NAMES.map((name, i) => ({ id: i, name })));
    setOrder(DEFAULT_TEAM_NAMES.map((_, i) => i));
    setPicks([]);
    setPlayers(computeRankings(DEFAULT_BASE));
    setProjMsg("");
    setMyTeamId(null);
    setStage("setup");
    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      /* best effort */
    }
  }, []);

  if (!ready) {
    return (
      <div style={styles.loadingScreen}>
        <div style={styles.loadingSpinner} />
        <div style={{ color: "#8b93a7", fontSize: 14, marginTop: 12 }}>
          Loading draft room…
        </div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <GlobalStyle />
      <UtilityBar
        onSave={handleSaveFile}
        onLoad={handleLoadFile}
        onExport={handleExportResults}
        onClearAll={handleClearAll}
        hasResults={picks.length > 0}
      />
      {stage === "setup" ? (
        <SetupScreen
          teams={teams}
          setTeams={setTeams}
          order={order}
          setOrder={setOrder}
          picksExist={picks.length > 0}
          onStart={() => setStage("draft")}
          onResetDraft={() => setPicks([])}
          onUpdateProjections={handleUpdateProjections}
          projMsg={projMsg}
        />
      ) : (
        <DraftScreen
          teams={teams}
          order={order}
          picks={picks}
          setPicks={setPicks}
          players={players}
          onEditSetup={() => setStage("setup")}
          onAddCustomPlayer={handleAddCustomPlayer}
          addPlayerMsg={addPlayerMsg}
          myTeamId={myTeamId}
          setMyTeamId={setMyTeamId}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   SETUP SCREEN
---------------------------------------------------------- */
function SetupScreen({
  teams,
  setTeams,
  order,
  setOrder,
  picksExist,
  onStart,
  onResetDraft,
  onUpdateProjections,
  projMsg,
}) {
  const renameTeam = (id, name) => {
    setTeams(teams.map((t) => (t.id === id ? { ...t, name } : t)));
  };

  const moveInOrder = (idx, dir) => {
    const next = [...order];
    const swap = idx + dir;
    if (swap < 0 || swap >= next.length) return;
    [next[idx], next[swap]] = [next[swap], next[idx]];
    setOrder(next);
  };

  const shuffle = () => {
    const next = [...order];
    for (let i = next.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [next[i], next[j]] = [next[j], next[i]];
    }
    setOrder(next);
  };

  const [dragIndex, setDragIndex] = useState(null);
  const [dragOverIndex, setDragOverIndex] = useState(null);
  const handleDragStart = (idx) => (e) => {
    setDragIndex(idx);
    e.dataTransfer.effectAllowed = "move";
  };
  const handleDragOver = (idx) => (e) => {
    e.preventDefault();
    if (idx !== dragOverIndex) setDragOverIndex(idx);
  };
  const handleDrop = (idx) => (e) => {
    e.preventDefault();
    if (dragIndex === null || dragIndex === idx) {
      setDragIndex(null);
      setDragOverIndex(null);
      return;
    }
    const next = [...order];
    const [moved] = next.splice(dragIndex, 1);
    next.splice(idx, 0, moved);
    setOrder(next);
    setDragIndex(null);
    setDragOverIndex(null);
  };
  const handleDragEnd = () => {
    setDragIndex(null);
    setDragOverIndex(null);
  };

  const teamById = (id) => teams.find((t) => t.id === id);
  const projInputRef = useRef(null);
  const totalPicks = teams.length * ROSTER_SPOTS;

  return (
    <div style={styles.setupWrap}>
      <div style={styles.setupHeader}>
        <div style={{ ...styles.eyebrow }}>{LEAGUE_NAME.toUpperCase()} · SNAKE DRAFT</div>
        <h1 style={styles.h1}>Set the room before the clock starts</h1>
        <p style={{ color: "#8b93a7", fontSize: 15, maxWidth: 560, lineHeight: 1.5 }}>
          Confirm your {teams.length} teams and the draft order. {ROSTER_SPOTS} roster
          spots per team, {totalPicks} total picks. The order reverses every round
          (standard snake) — set round 1's order below.
        </p>
      </div>

      <section style={styles.panel}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={styles.panelTitle}>Teams & round 1 draft order</div>
          <button style={styles.ghostBtnSm} onClick={shuffle}>
            Shuffle order
          </button>
        </div>
        <p style={{ color: "#7d8599", fontSize: 12.5, marginTop: -4, marginBottom: 8 }}>
          Drag a row to reorder, use the arrows, or rename a team right in its row.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {order.map((teamId, idx) => (
            <div
              key={teamId}
              draggable
              onDragStart={handleDragStart(idx)}
              onDragOver={handleDragOver(idx)}
              onDrop={handleDrop(idx)}
              onDragEnd={handleDragEnd}
              style={{
                ...styles.orderRow,
                opacity: dragIndex === idx ? 0.35 : 1,
                border: dragOverIndex === idx && dragIndex !== idx ? "1px solid #e0b34a" : "1px solid #232a38",
              }}
            >
              <span style={styles.dragHandle} title="Drag to reorder">
                ⠿
              </span>
              <span style={styles.orderNum}>{idx + 1}</span>
              <input
                value={teamById(teamId)?.name ?? ""}
                onChange={(e) => renameTeam(teamId, e.target.value)}
                size={Math.max(3, (teamById(teamId)?.name ?? "").length)}
                style={styles.teamNameInputInline}
              />
              <div style={{ flex: 1 }} />
              <button
                aria-label="Move up"
                draggable={false}
                style={styles.orderArrow}
                onClick={() => moveInOrder(idx, -1)}
                disabled={idx === 0}
              >
                ↑
              </button>
              <button
                aria-label="Move down"
                draggable={false}
                style={styles.orderArrow}
                onClick={() => moveInOrder(idx, 1)}
                disabled={idx === order.length - 1}
              >
                ↓
              </button>
            </div>
          ))}
        </div>
      </section>

      <section style={{ ...styles.panel, marginTop: 16 }}>
        <div style={styles.panelTitle}>Update projections</div>
        <p style={{ color: "#7d8599", fontSize: 13, marginTop: -4, marginBottom: 10 }}>
          This fully replaces the player pool with your upload — export a CSV from the
          workbook with "Player", "Position", and "Points" columns (names need to match
          exactly, e.g. "Josh Allen BUF"). Names already in the pool get their points
          updated, new names get added, and anyone from the current pool who isn't in
          your file gets removed — except a player already drafted, since dropping them
          mid-draft would break your rosters. Uploading recomputes VBD, tiers, and
          scarcity for the whole pool using {LEAGUE_NAME}'s scoring settings.
        </p>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <button style={styles.ghostBtnSm} onClick={() => projInputRef.current?.click()}>
            Choose CSV file
          </button>
          <input
            ref={projInputRef}
            type="file"
            accept=".csv"
            style={{ display: "none" }}
            onChange={(e) => {
              const f = e.target.files?.[0];
              if (f) onUpdateProjections(f);
              e.target.value = "";
            }}
          />
          {projMsg && <span style={{ fontSize: 12.5, color: "#8b93a7" }}>{projMsg}</span>}
        </div>
      </section>

      <div style={{ display: "flex", gap: 12, marginTop: 24, alignItems: "center", flexWrap: "wrap" }}>
        <button style={styles.primaryBtn} onClick={onStart}>
          {picksExist ? "Return to draft" : "Start the draft"}
        </button>
        {picksExist && (
          <button
            style={styles.dangerGhostBtn}
            onClick={() => {
              if (window.confirm("Clear all picks and start over? Team names and order stay.")) {
                onResetDraft();
              }
            }}
          >
            Reset all picks
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   DRAFT SCREEN
---------------------------------------------------------- */
function DraftScreen({ teams, order, picks, setPicks, players, onEditSetup, onAddCustomPlayer, addPlayerMsg, myTeamId, setMyTeamId }) {
  const [view, setView] = useState("board"); // board | rosters | analysis | board2
  const [posFilter, setPosFilter] = useState(() => new Set());
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState("scarcityRank");
  const [nomPlayerId, setNomPlayerId] = useState(null);
  const [error, setError] = useState("");
  const [playerQuery, setPlayerQuery] = useState("");
  const [showAddPlayer, setShowAddPlayer] = useState(false);
  const [addName, setAddName] = useState("");
  const [addPos, setAddPos] = useState("RB");

  const myTeamEntries = useMemo(() => {
    if (myTeamId === null) return [];
    return picks.filter((p) => p.teamId === myTeamId);
  }, [myTeamId, picks]);

  const myTeamLineup = useMemo(() => {
    if (myTeamId === null) return null;
    return buildLineup(myTeamEntries, players, ROSTER_REQUIREMENTS);
  }, [myTeamId, myTeamEntries, players]);

  // Need multiplier: how much this team should prioritize a position right now,
  // based on which of their own roster slots are still open.
  const needMultiplier = (position) => {
    if (!myTeamLineup) return 1;
    const hardSlots = myTeamLineup.slots.filter(
      (s) => s.label.startsWith(position) && !s.label.startsWith("FLEX")
    );
    if (hardSlots.some((s) => !s.entry)) return 1.25;
    const flexEligible = FLEX_ELIGIBLE.includes(position);
    if (flexEligible) {
      const flexSlots = myTeamLineup.slots.filter((s) => s.label.startsWith("FLEX"));
      if (flexSlots.some((s) => !s.entry)) return 1.1;
    }
    const capacity = (ROSTER_REQUIREMENTS[position] || 0) + (flexEligible ? ROSTER_REQUIREMENTS.FLEX || 0 : 0);
    const countAtPos = myTeamEntries.filter((e) => {
      const p = players.find((pp) => pp.id === e.playerId);
      return p && p.position === position;
    }).length;
    if (countAtPos > capacity + 2) return 0.85;
    return 1;
  };

  const draftedIds = useMemo(() => new Set(picks.map((p) => p.playerId)), [picks]);

  const countByTeam = useMemo(() => {
    const m = {};
    teams.forEach((t) => (m[t.id] = 0));
    picks.forEach((p) => (m[p.teamId] = (m[p.teamId] || 0) + 1));
    return m;
  }, [picks, teams]);

  const totalPicks = teams.length * ROSTER_SPOTS;
  const draftComplete = picks.length >= totalPicks;
  const onClockTeamId = draftComplete ? null : teamOnClock(order, picks.length);
  const onClockTeam = teams.find((t) => t.id === onClockTeamId);
  const round = Math.floor(picks.length / order.length) + 1;
  const pickInRound = (picks.length % order.length) + 1;

  const availablePlayers = useMemo(
    () => players.filter((p) => !draftedIds.has(p.id)),
    [players, draftedIds]
  );

  const boardPlayers = useMemo(() => {
    let list = availablePlayers;
    if (posFilter.size > 0) list = list.filter((p) => posFilter.has(p.position));
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter((p) => p.name.toLowerCase().includes(q));
    }
    // When a team is selected, enrich each row with a need-adjusted score —
    // the underlying players array stays pure value data (used elsewhere,
    // e.g. Draft Analysis for every team), this is purely a display/sort layer.
    if (myTeamId !== null) {
      list = list.map((p) => {
        const mult = needMultiplier(p.position);
        return { ...p, needMult: mult, personalScore: p.scarcity * mult };
      });
      // Best-for-my-team + no position filter: once this team already has a
      // K or DEF, stop surfacing more of them here — they're single-slot
      // positions with no flex/bench upside, so once filled they're just
      // noise sitting above real remaining needs.
      if (sortKey === "personal" && posFilter.size === 0) {
        list = list.filter((p) => !(["K", "DEF"].includes(p.position) && p.needMult < 1.25));
      }
    }
    const sorters = {
      scarcity: (a, b) => b.scarcity - a.scarcity,
      scarcityRank: (a, b) => a.scarcityRank - b.scarcityRank,
      personal: (a, b) => b.personalScore - a.personalScore,
      rank: (a, b) => a.overallRank - b.overallRank,
      points: (a, b) => b.points - a.points,
      vbd: (a, b) => b.vbd - a.vbd,
      name: (a, b) => a.name.localeCompare(b.name),
    };
    return [...list].sort(sorters[sortKey] || sorters.scarcityRank);
  }, [availablePlayers, posFilter, search, sortKey, myTeamId, myTeamLineup]);

  useEffect(() => {
    if (myTeamId !== null) setSortKey("personal");
  }, [myTeamId]);

  const togglePosition = (pos) => {
    setPosFilter((prev) => {
      const next = new Set(prev);
      if (next.has(pos)) next.delete(pos);
      else next.add(pos);
      return next;
    });
  };

  const toggleGroup = (group) => {
    setPosFilter((prev) => {
      const allIn = group.every((p) => prev.has(p));
      const next = new Set(prev);
      group.forEach((p) => (allIn ? next.delete(p) : next.add(p)));
      return next;
    });
  };


  const topByPosition = useMemo(() => {
    const out = {};
    POSITIONS.forEach((pos) => {
      out[pos] = availablePlayers
        .filter((p) => p.position === pos)
        .sort((a, b) => b.scarcity - a.scarcity)
        .slice(0, 3);
    });
    return out;
  }, [availablePlayers]);

  const playerSearchResults = useMemo(() => {
    if (!playerQuery.trim()) return [];
    const q = playerQuery.trim().toLowerCase();
    return availablePlayers
      .filter((p) => p.name.toLowerCase().includes(q))
      .slice(0, 8);
  }, [playerQuery, availablePlayers]);

  const [highlightIndex, setHighlightIndex] = useState(0);
  useEffect(() => {
    setHighlightIndex(0);
  }, [playerQuery]);

  const selectedPlayer = players.find((p) => p.id === nomPlayerId);

  const pickPlayer = (p) => {
    setNomPlayerId(p.id);
    setPlayerQuery(p.name);
    setError("");
  };

  const submitPick = (explicitPlayerId) => {
    setError("");
    const playerId = explicitPlayerId !== undefined && explicitPlayerId !== null ? explicitPlayerId : nomPlayerId;
    if (draftComplete) {
      setError("The draft is already complete — every roster spot is filled.");
      return;
    }
    if (playerId === null || playerId === undefined) {
      setError("Search for and select a player first.");
      return;
    }
    if (draftedIds.has(playerId)) {
      setError("That player is already drafted.");
      return;
    }
    const newPick = {
      playerId,
      teamId: onClockTeamId,
      pickNum: picks.length + 1,
    };
    setPicks([...picks, newPick]);
    setNomPlayerId(null);
    setPlayerQuery("");
    setHighlightIndex(0);
  };

  const handleSearchKeyDown = (e) => {
    if (e.key === "ArrowDown") {
      if (playerSearchResults.length === 0) return;
      e.preventDefault();
      setHighlightIndex((i) => Math.min(i + 1, playerSearchResults.length - 1));
    } else if (e.key === "ArrowUp") {
      if (playerSearchResults.length === 0) return;
      e.preventDefault();
      setHighlightIndex((i) => Math.max(i - 1, 0));
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (playerSearchResults.length > 0 && nomPlayerId === null) {
        const chosen = playerSearchResults[highlightIndex] || playerSearchResults[0];
        if (chosen) submitPick(chosen.id);
      } else if (nomPlayerId !== null) {
        submitPick(nomPlayerId);
      }
    }
  };

  const undoLast = () => {
    if (picks.length === 0) return;
    setPicks(picks.slice(0, -1));
  };

  const recentPicks = [...picks].slice(-order.length).reverse();

  return (
    <div style={styles.draftWrap}>
      <div style={styles.topBar}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
          <div style={styles.eyebrowSmall}>{LEAGUE_NAME.toUpperCase()} DRAFT</div>
          <div style={{ fontSize: 13, color: "#8b93a7" }}>
            Pick {Math.min(picks.length + 1, totalPicks)} of {totalPicks} · {teams.length} teams
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={styles.ghostBtnSm} onClick={undoLast} disabled={picks.length === 0}>
            Undo last pick
          </button>
          <button style={styles.ghostBtnSm} onClick={onEditSetup}>
            Edit setup
          </button>
        </div>
      </div>

      <div style={styles.myTeamBar}>
        <span style={{ fontSize: 12.5, color: "#8b93a7", fontWeight: 600 }}>My team:</span>
        <select
          value={myTeamId ?? ""}
          onChange={(e) => setMyTeamId(e.target.value === "" ? null : parseInt(e.target.value, 10))}
          style={styles.nomSelect}
        >
          <option value="">— Not set —</option>
          {teams.map((t) => (
            <option key={t.id} value={t.id}>
              {t.name}
            </option>
          ))}
        </select>
        {myTeamId !== null && (
          <span style={{ fontSize: 12.5, color: "#7d8599" }}>
            Board's sorted for your remaining needs — {ROSTER_SPOTS - myTeamEntries.length} spots to fill.
          </span>
        )}
      </div>

      <div className="clock-bar" style={styles.clockBar}>
        <div>
          <div style={{ fontSize: 12, color: "#7d8599", letterSpacing: 0.5, textTransform: "uppercase" }}>
            {draftComplete ? "Draft complete" : "On the clock"}
          </div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#f4c95d" }}>
            {draftComplete ? "All rosters full" : onClockTeam?.name}
          </div>
        </div>
        {!draftComplete && (
          <div className="clock-stats" style={styles.clockStats}>
            <ClockStat label="Round" value={round} />
            <ClockStat label="Pick in round" value={`${pickInRound}/${order.length}`} />
            <ClockStat label="Their spots left" value={ROSTER_SPOTS - (countByTeam[onClockTeamId] || 0)} />
          </div>
        )}
      </div>

      {recentPicks.length > 0 && <Ticker picks={picks} players={players} teams={teams} order={order} />}

      {!draftComplete && (
        <>
          <div style={styles.nomPanel}>
            <div style={{ position: "relative", flex: "1 1 320px", minWidth: 220 }}>
              <input
                placeholder="Search player to draft…"
                value={playerQuery}
                onChange={(e) => {
                  setPlayerQuery(e.target.value);
                  setNomPlayerId(null);
                }}
                onKeyDown={handleSearchKeyDown}
                style={styles.nomInput}
              />
              {playerQuery && playerSearchResults.length > 0 && nomPlayerId === null && (
                <div style={styles.searchDropdown}>
                  {playerSearchResults.map((p, idx) => (
                    <div
                      key={p.id}
                      style={{
                        ...styles.searchResultRow,
                        background: idx === highlightIndex ? "rgba(224,179,74,0.16)" : undefined,
                      }}
                      onMouseEnter={() => setHighlightIndex(idx)}
                      onClick={() => pickPlayer(p)}
                    >
                      <PosPill pos={p.position} />
                      <span style={{ flex: 1 }}>{p.name}</span>
                      <span style={{ color: "#8b93a7", fontSize: 12 }}>#{p.scarcityRank}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <button style={styles.primaryBtn} onClick={() => submitPick()}>
              Draft player
            </button>
          </div>
          {selectedPlayer && (
            <div style={{ fontSize: 13, color: "#8b93a7", marginTop: -8, marginBottom: 4 }}>
              Drafting <b style={{ color: "#e7ebf3" }}>{selectedPlayer.name}</b> for{" "}
              <b style={{ color: "#e7ebf3" }}>{onClockTeam?.name}</b> · overall rank #{selectedPlayer.overallRank}
            </div>
          )}
        </>
      )}
      {error && <div style={styles.errorBox}>{error}</div>}

      <div style={{ marginBottom: 14 }}>
        <button style={styles.ghostBtnSm} onClick={() => setShowAddPlayer((v) => !v)}>
          {showAddPlayer ? "Cancel" : "+ Add player not in the list"}
        </button>
        {showAddPlayer && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
            <input
              placeholder="Player name"
              value={addName}
              onChange={(e) => setAddName(e.target.value)}
              style={{ ...styles.nomInput, flex: "1 1 220px" }}
            />
            <select value={addPos} onChange={(e) => setAddPos(e.target.value)} style={styles.nomSelect}>
              {POSITIONS.map((pos) => (
                <option key={pos} value={pos}>
                  {pos}
                </option>
              ))}
            </select>
            <button
              style={styles.primaryBtn}
              onClick={() => {
                onAddCustomPlayer(addName, addPos);
                setAddName("");
              }}
            >
              Add player
            </button>
          </div>
        )}
        {showAddPlayer && addPlayerMsg && (
          <div style={{ fontSize: 12.5, color: "#8b93a7", marginTop: 6 }}>{addPlayerMsg}</div>
        )}
      </div>

      <div style={styles.viewSwitch}>
        <button style={view === "board" ? styles.tabActive : styles.tab} onClick={() => setView("board")}>
          Player board
        </button>
        <button style={view === "rosters" ? styles.tabActive : styles.tab} onClick={() => setView("rosters")}>
          Team rosters
        </button>
        <button style={view === "analysis" ? styles.tabActive : styles.tab} onClick={() => setView("analysis")}>
          Draft analysis
        </button>
        <button style={view === "board2" ? styles.tabActive : styles.tab} onClick={() => setView("board2")}>
          Draft board
        </button>
        <button style={view === "lessons" ? styles.tabActive : styles.tab} onClick={() => setView("lessons")}>
          Lessons learned
        </button>
      </div>

      {view === "board" ? (
        <div className="board-layout" style={styles.boardLayout}>
          <div style={{ minWidth: 0 }}>
            <div style={styles.boardControls}>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <FilterChip label="ALL" active={posFilter.size === 0} onClick={() => setPosFilter(new Set())} />
                {POSITIONS.map((pos) => (
                  <FilterChip
                    key={pos}
                    label={pos}
                    color={POS_COLOR[pos]}
                    active={posFilter.has(pos)}
                    onClick={() => togglePosition(pos)}
                  />
                ))}
                <FilterChip
                  label="FLEX"
                  color="#f4c95d"
                  active={FLEX_ELIGIBLE.every((p) => posFilter.has(p))}
                  onClick={() => toggleGroup(FLEX_ELIGIBLE)}
                />
              </div>
              <div style={{ display: "flex", gap: 8, flex: "1 1 260px" }}>
                <input
                  placeholder="Filter board…"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  style={{ ...styles.nomInput, flex: 1 }}
                />
                <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} style={styles.nomSelect}>
                  {myTeamId !== null && <option value="personal">Sort: Best for my team</option>}
                  <option value="scarcityRank">Sort: Scarcity ranking</option>
                  <option value="rank">Sort: Overall rank</option>
                  <option value="vbd">Sort: VBD</option>
                  <option value="name">Sort: Name</option>
                </select>
              </div>
            </div>

            <div style={styles.tableWrap}>
              <table style={styles.table}>
                <thead>
                  <tr>
                    <th style={styles.th}>Player</th>
                    <th style={styles.th}>Pos</th>
                    <th style={styles.thNum}>Bye</th>
                    <th style={styles.thNum}>Pts</th>
                    <th style={styles.thNum}>Tier</th>
                    <th style={styles.thNum}>VBD</th>
                    <th style={styles.thNum}>Overall Rank</th>
                    <th style={styles.thNum}>Scarcity Rank</th>
                    <th style={styles.thNum}></th>
                  </tr>
                </thead>
                <tbody>
                  {boardPlayers.map((p) => (
                    <tr
                      key={p.id}
                      style={{
                        ...styles.tr,
                        background: nomPlayerId === p.id ? "rgba(224,179,74,0.12)" : undefined,
                      }}
                      onClick={() => pickPlayer(p)}
                    >
                      <td style={styles.tdName}>
                        {p.name}
                        {myTeamId !== null && p.needMult >= 1.25 && <span style={styles.needTag}>NEED</span>}
                        {myTeamId !== null && p.needMult === 1.1 && <span style={styles.flexTag}>FLEX</span>}
                      </td>
                      <td style={styles.td}>
                        <PosPill pos={p.position} />
                      </td>
                      <td style={styles.tdNum}>{p.bye ?? "—"}</td>
                      <td style={styles.tdNum}>{p.points.toFixed(1)}</td>
                      <td style={styles.tdNum}>{p.tier.replace("Tier ", "T")}</td>
                      <td style={styles.tdNum}>{p.vbd.toFixed(1)}</td>
                      <td style={styles.tdNum}>#{p.overallRank}</td>
                      <td style={styles.tdNum}>#{p.scarcityRank}</td>
                      <td style={styles.td}>
                        <button
                          style={styles.rowDraftBtn}
                          onClick={(e) => {
                            e.stopPropagation();
                            submitPick(p.id);
                          }}
                          disabled={draftComplete}
                        >
                          Draft
                        </button>
                      </td>
                    </tr>
                  ))}
                  {boardPlayers.length === 0 && (
                    <tr>
                      <td colSpan={9} style={{ padding: 24, textAlign: "center", color: "#7d8599" }}>
                        No available players match that filter.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          <div style={styles.sidebar}>
            <div style={styles.panel}>
              <div style={styles.panelTitle}>Roster spots filled</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {order.map((teamId) => {
                  const t = teams.find((tt) => tt.id === teamId);
                  const isUp = teamId === onClockTeamId;
                  return (
                    <div
                      key={teamId}
                      style={{
                        ...styles.teamRow,
                        border: isUp ? "1px solid #e0b34a" : "1px solid transparent",
                        background: isUp ? "rgba(224,179,74,0.08)" : "#161b26",
                      }}
                    >
                      <span style={{ flex: 1, fontSize: 13, fontWeight: isUp ? 700 : 500 }}>{t?.name}</span>
                      <span style={{ fontSize: 12, color: "#7d8599" }}>
                        {countByTeam[teamId] || 0}/{ROSTER_SPOTS}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={styles.panel}>
              <div style={styles.panelTitle}>Best available by position</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {POSITIONS.map((pos) => (
                  <div key={pos}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                      <PosPill pos={pos} />
                      {myTeamId !== null && needMultiplier(pos) >= 1.25 && <span style={styles.needTag}>NEED</span>}
                      {myTeamId !== null && needMultiplier(pos) === 1.1 && <span style={styles.flexTag}>FLEX</span>}
                    </div>
                    {topByPosition[pos].map((p) => (
                      <div key={p.id} style={styles.recRow} onClick={() => pickPlayer(p)} title="Click to draft">
                        <span style={{ flex: 1 }}>{p.name}</span>
                        <span style={styles.mono}>#{p.scarcityRank}</span>
                      </div>
                    ))}
                    {topByPosition[pos].length === 0 && (
                      <div style={{ fontSize: 12, color: "#5f6779" }}>All drafted</div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      ) : view === "rosters" ? (
        <RostersView teams={teams} order={order} picks={picks} players={players} />
      ) : view === "analysis" ? (
        <DraftAnalysisView teams={teams} order={order} picks={picks} players={players} />
      ) : view === "board2" ? (
        <DraftBoardView teams={teams} order={order} picks={picks} players={players} />
      ) : (
        <LessonsLearnedView teams={teams} order={order} picks={picks} players={players} myTeamId={myTeamId} />
      )}
    </div>
  );
}

function ClockStat({ label, value }) {
  return (
    <div style={{ textAlign: "right" }}>
      <div style={{ fontSize: 10, color: "#7d8599", textTransform: "uppercase", letterSpacing: 0.5 }}>
        {label}
      </div>
      <div style={{ fontSize: 17, fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>{value}</div>
    </div>
  );
}

function PosPill({ pos, small }) {
  const c = POS_COLOR[pos] || "#8b93a7";
  return (
    <span
      style={{
        display: "inline-block",
        flexShrink: 0,
        fontSize: small ? 9.5 : 11,
        fontWeight: 700,
        padding: small ? "1px 4px" : "2px 7px",
        borderRadius: 5,
        color: "#0d0f14",
        background: c,
        letterSpacing: 0.3,
      }}
    >
      {pos}
    </span>
  );
}

function FilterChip({ label, active, onClick, color }) {
  return (
    <button
      onClick={onClick}
      style={{
        padding: "6px 12px",
        borderRadius: 999,
        fontSize: 12,
        fontWeight: 600,
        border: active ? `1px solid ${color || "#e0b34a"}` : "1px solid #2a3040",
        background: active ? (color ? color + "22" : "rgba(224,179,74,0.12)") : "transparent",
        color: active ? "#f0f2f6" : "#8b93a7",
        cursor: "pointer",
      }}
    >
      {label}
    </button>
  );
}

function Ticker({ picks, players, teams, order }) {
  const items = [...picks].slice(-order.length).reverse();
  return (
    <div style={styles.tickerOuter}>
      <div style={styles.tickerWrap}>
        {items.map((pk, i) => {
          const p = players.find((pp) => pp.id === pk.playerId);
          const t = teams.find((tt) => tt.id === pk.teamId);
          const round = Math.floor((pk.pickNum - 1) / order.length) + 1;
          const pickInRound = ((pk.pickNum - 1) % order.length) + 1;
          return (
            <span key={i} style={styles.tickerChip}>
              <PosPill pos={p?.position} small />
              <b style={{ margin: "0 6px" }}>{p?.name}</b>
              <span style={{ color: "#7d8599" }}>→ {t?.name}</span>
              <span style={styles.mono}>
                {" "}
                {round}.{String(pickInRound).padStart(2, "0")}
              </span>
            </span>
          );
        })}
      </div>
    </div>
  );
}

function RostersView({ teams, order, picks, players }) {
  return (
    <div style={styles.rosterGrid}>
      {order.map((teamId) => {
        const t = teams.find((tt) => tt.id === teamId);
        const teamPicks = picks.filter((p) => p.teamId === teamId);
        const { slots, bench } = buildLineup(teamPicks, players, ROSTER_REQUIREMENTS);
        const pickRoundLabel = (pk) => {
          const round = Math.floor((pk.pickNum - 1) / order.length) + 1;
          const pickInRound = ((pk.pickNum - 1) % order.length) + 1;
          return `${round}.${String(pickInRound).padStart(2, "0")}`;
        };
        return (
          <div key={teamId} style={styles.rosterCard}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{t?.name}</div>
              <div style={{ fontSize: 12, color: "#7d8599" }}>
                {teamPicks.length}/{ROSTER_SPOTS}
              </div>
            </div>
            {teamPicks.length === 0 ? (
              <div style={{ fontSize: 12, color: "#5f6779", padding: "8px 0" }}>No players yet</div>
            ) : (
              <>
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {slots.map((sl, i) => {
                    const pk = sl.entry;
                    const p = pk ? players.find((pp) => pp.id === pk.playerId) : null;
                    return (
                      <div key={sl.label + i} style={styles.rosterRow}>
                        <span style={styles.slotLabel}>{sl.label}</span>
                        {p ? (
                          <>
                            <PosPill pos={p.position} />
                            <span style={styles.rosterName}>{p.name}</span>
                            <span style={styles.mono}>{pickRoundLabel(pk)}</span>
                          </>
                        ) : (
                          <span style={{ ...styles.rosterName, color: "#5f6779" }}>Empty</span>
                        )}
                      </div>
                    );
                  })}
                </div>
                {bench.length > 0 && (
                  <>
                    <div style={styles.benchDivider}>BENCH</div>

}

function DraftAnalysisView({ teams, order, picks, players }) {
  const [sortCol, setSortCol] = useState("starterRank");
  const [sortDir, setSortDir] = useState("asc");

  const rows = useMemo(() => {
    return order.map((teamId) => {
      const t = teams.find((tt) => tt.id === teamId);
      const teamPicks = picks.filter((p) => p.teamId === teamId);
      const playerCount = teamPicks.length;
      let projPoints = 0;
      let rankSum = 0;
      let scarcitySum = 0;
      teamPicks.forEach((pk) => {
        const p = players.find((pp) => pp.id === pk.playerId);
        if (p) {
          projPoints += p.points;
          rankSum += p.overallRank;
          scarcitySum += p.scarcity;
        }
      });
      const { starterPoints } = buildLineup(teamPicks, players, ROSTER_REQUIREMENTS);
      const avgProj = playerCount === 0 ? 0 : projPoints / playerCount;
      const avgRank = playerCount === 0 ? 0 : rankSum / playerCount;
      return { teamId, name: t?.name, playerCount, projPoints, starterPoints, avgProj, avgRank, scarcitySum };
    });
  }, [teams, order, picks, players]);

  const hasAny = rows.some((r) => r.playerCount > 0);

  if (!hasAny) {
    return (
      <div style={{ color: "#7d8599", padding: "24px 4px", fontSize: 13 }}>
        No picks logged yet — analysis fills in as the draft happens.
      </div>
    );
  }

  const pointsRankMap = {};
  [...rows].sort((a, b) => b.projPoints - a.projPoints).forEach((r, i) => (pointsRankMap[r.teamId] = i + 1));

  const starterRankMap = {};
  [...rows]
    .sort((a, b) => b.starterPoints - a.starterPoints)
    .forEach((r, i) => (starterRankMap[r.teamId] = i + 1));

  const valueRankMap = {};
  [...rows].sort((a, b) => b.scarcitySum - a.scarcitySum).forEach((r, i) => (valueRankMap[r.teamId] = i + 1));

  const withRanks = rows.map((r) => ({
    ...r,
    pointsRank: pointsRankMap[r.teamId],
    starterRank: starterRankMap[r.teamId],
    valueRank: valueRankMap[r.teamId],
  }));

  const columns = [
    { key: "name", label: "Team", tip: "The team this row summarizes." },
    { key: "playerCount", label: "Players", tip: "Total players drafted so far." },
    {
      key: "starterPoints",
      label: "Starter Pts",
      fmt: (v) => v.toFixed(1),
      tip: "Total projected points from only the players in this team's starting lineup — bench production is excluded.",
    },
    {
      key: "starterRank",
      label: "Starter Rank",
      fmt: (v) => "#" + v,
      tip: "Rank among all teams by Starter Pts — the best gauge of who's actually built the strongest active roster.",
    },
    {
      key: "projPoints",
      label: "Proj Pts",
      fmt: (v) => v.toFixed(1),
      tip: "Total projected points across every drafted player, starters and bench combined.",
    },
    {
      key: "pointsRank",
      label: "Pts Rank",
      fmt: (v) => "#" + v,
      tip: "Rank among all teams by total Proj Pts (starters + bench).",
    },
    {
      key: "avgProj",
      label: "Avg Pts/Plyr",
      fmt: (v) => v.toFixed(1),
      tip: "Proj Pts divided by number of players drafted — a quick read on average roster quality regardless of roster size.",
    },
    {
      key: "avgRank",
      label: "Avg Pick Rank",
      fmt: (v) => (v ? v.toFixed(0) : "—"),
      tip: "Average preseason overall rank of the players this team landed — lower means more top-ranked talent relative to the big board.",
    },
    {
      key: "valueRank",
      label: "Value Rank",
      fmt: (v) => "#" + v,
      tip: "Rank among all teams by total scarcity value drafted — rewards landing players who were scarce at their position, not just high-scoring.",
    },
  ];

  const rankLikeAsc = new Set(["name", "starterRank", "pointsRank", "avgRank", "valueRank"]);

  const handleSort = (key) => {
    if (sortCol === key) {
      setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    } else {
      setSortCol(key);
      setSortDir(rankLikeAsc.has(key) ? "asc" : "desc");
    }
  };

  const sortedRows = [...withRanks].sort((a, b) => {
    const av = a[sortCol];
    const bv = b[sortCol];
    if (typeof av === "string") {
      return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    return sortDir === "asc" ? av - bv : bv - av;
  });

  return (
    <div>
      <p style={{ color: "#7d8599", fontSize: 13, marginTop: -4, marginBottom: 10 }}>
        Starter Pts counts only the players in each team's starting lineup (see Team
        Rosters) — bench production is excluded. Avg Pick Rank is the average preseason
        overall rank of the players each team landed. Click any column to sort.
      </p>
      <div style={styles.tableWrap}>
        <table style={styles.table}>
          <thead>
            <tr>
              {columns.map((c) => (
                <th
                  key={c.key}
                  style={{ ...(c.key === "name" ? styles.th : styles.thNum), cursor: "pointer", userSelect: "none" }}
                  onClick={() => handleSort(c.key)}
                  title={c.tip}
                >
                  {c.label}
                  {sortCol === c.key ? (sortDir === "asc" ? " ▲" : " ▼") : ""}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sortedRows.map((r) => (
              <tr key={r.teamId} style={{ ...styles.tr, cursor: "default" }}>
                {columns.map((c) => {
                  const raw = r[c.key];
                  const display = c.fmt ? c.fmt(raw) : raw;
                  return (
                    <td key={c.key} style={c.key === "name" ? styles.tdName : styles.tdNum}>
                      {display}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function DraftBoardView({ teams, order, picks, players }) {
  const perTeam = useMemo(() => {
    const m = {};
    order.forEach((id) => (m[id] = []));
    picks
      .slice()
      .sort((a, b) => a.pickNum - b.pickNum)
      .forEach((pk) => {
        if (m[pk.teamId]) m[pk.teamId].push(pk);
      });
    return m;
  }, [order, picks]);

  const maxRounds = Math.max(1, ...order.map((id) => perTeam[id].length));
  const rounds = Array.from({ length: maxRounds }, (_, i) => i + 1);

  if (picks.length === 0) {
    return (
      <div style={{ color: "#7d8599", padding: "24px 4px", fontSize: 13 }}>
        No picks logged yet — the board fills in as the draft happens.
      </div>
    );
  }

  return (
    <div>
      <p style={{ color: "#7d8599", fontSize: 13, marginTop: -4, marginBottom: 10 }}>
        Standard snake draft board — each row is one round, alternating direction as usual.
      </p>
      <div style={styles.boardTableWrap}>
        <table style={{ ...styles.table, ...styles.boardTable }}>
          <thead>
            <tr>
              <th style={{ ...styles.boardTh, position: "sticky", left: 0, zIndex: 2, width: 34 }}>Rd</th>
              {order.map((id) => (
                <th key={id} style={styles.boardTh}>
                  {teams.find((t) => t.id === id)?.name}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rounds.map((r) => (
              <tr key={r}>
                <td style={{ ...styles.boardTd, position: "sticky", left: 0, background: "#0d0f14", fontWeight: 700 }}>
                  {r}
                </td>
                {order.map((id) => {
                  const entry = perTeam[id][r - 1];
                  const p = entry ? players.find((pp) => pp.id === entry.playerId) : null;
                  return (
                    <td key={id} style={styles.boardTd} title={p ? p.name : ""}>
                      {p ? (
                        <div style={{ display: "flex", alignItems: "center", gap: 4, overflow: "hidden" }}>
                          <PosPill pos={p.position} small />
                          <span style={styles.boardTdName}>{p.name}</span>
                        </div>
                      ) : (
                        <span style={{ color: "#3a4256" }}>—</span>
                      )}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LessonsLearnedView({ teams, order, picks, players, myTeamId }) {
  const rows = useMemo(() => {
    return order.map((teamId) => {
      const t = teams.find((tt) => tt.id === teamId);
      const teamPicks = picks.filter((p) => p.teamId === teamId);
      const { starterPoints } = buildLineup(teamPicks, players, ROSTER_REQUIREMENTS);
      return { teamId, name: t?.name, starterPoints, playerCount: teamPicks.length };
    });
  }, [teams, order, picks, players]);

  if (picks.length === 0) {
    return (
      <div style={{ color: "#7d8599", padding: "24px 4px", fontSize: 13 }}>
        Lessons and trends will fill in once the draft happens.
      </div>
    );
  }

  const starterRankMap = {};
  [...rows].sort((a, b) => b.starterPoints - a.starterPoints).forEach((r, i) => (starterRankMap[r.teamId] = i + 1));

  const myRow = myTeamId !== null ? rows.find((r) => r.teamId === myTeamId) : null;
  const myStarterRank = myRow ? starterRankMap[myRow.teamId] : null;

  const posTrend = {};
  picks.forEach((pk) => {
    const p = players.find((pp) => pp.id === pk.playerId);
    if (!p) return;
    if (!posTrend[p.position]) posTrend[p.position] = { sum: 0, count: 0 };
    posTrend[p.position].sum += pk.pickNum;
    posTrend[p.position].count += 1;
  });
  const posTrendSorted = Object.entries(posTrend)
    .map(([pos, d]) => ({ pos, avgPick: d.sum / d.count, count: d.count }))
    .sort((a, b) => a.avgPick - b.avgPick);

  let myPosBreakdown = null;
  if (myRow) {
    const leaguePos = {};
    const myPos = {};
    order.forEach((tid) => {
      picks
        .filter((pk) => pk.teamId === tid)
        .forEach((pk) => {
          const p = players.find((pp) => pp.id === pk.playerId);
          if (!p) return;
          leaguePos[p.position] = (leaguePos[p.position] || 0) + p.scarcity;
          if (tid === myTeamId) myPos[p.position] = (myPos[p.position] || 0) + p.scarcity;
        });
    });
    myPosBreakdown = POSITIONS.map((pos) => {
      const leagueAvgPerTeam = (leaguePos[pos] || 0) / order.length;
      const mine = myPos[pos] || 0;
      return { pos, mine, leagueAvgPerTeam, diff: mine - leagueAvgPerTeam };
    });
  }

  const tips = [];
  if (myRow) {
    const third = Math.ceil(order.length / 3);
    if (myStarterRank <= third) {
      tips.push(
        `Your starting lineup ranked #${myStarterRank} of ${order.length} — one of the strongest rosters in the league. Whatever approach got you here is worth repeating.`
      );
    } else if (myStarterRank > order.length - third) {
      tips.push(
        `Your starting lineup ranked #${myStarterRank} of ${order.length} — near the bottom of the league. The position breakdown below points at where you fell behind.`
      );
    } else {
      tips.push(`Your starting lineup ranked #${myStarterRank} of ${order.length} — solidly middle of the pack.`);
    }
    if (myPosBreakdown) {
      const sorted = [...myPosBreakdown].sort((a, b) => a.diff - b.diff);
      const worst = sorted[0];
      const best = sorted[sorted.length - 1];
      if (worst && worst.diff < -50) {
        tips.push(
          `${worst.pos} was your weakest position relative to the rest of the league — prioritize it earlier in next year's draft.`
        );
      }
      if (best && best.diff > 50) {
        tips.push(`${best.pos} was a real strength — you out-drafted the league average there by a wide margin.`);
      }
    }
  } else {
    tips.push(`Pick "My team" on the Draft screen next time to get a personalized breakdown here.`);
  }
  if (posTrendSorted.length > 0) {
    const earliest = posTrendSorted[0];
    const latest = posTrendSorted[posTrendSorted.length - 1];
    tips.push(
      `${earliest.pos} went earliest on average this draft (pick ${earliest.avgPick.toFixed(
        1
      )}) — expect a similar run next year and plan to be aggressive there early if you want one.`
    );
    tips.push(
      `${latest.pos} was drafted latest on average (pick ${latest.avgPick.toFixed(
        1
      )}) — little urgency to reach for it ahead of schedule.`
    );
  }
  tips.push(
    `This draft's actual picks have already been folded into the Scarcity Rank and recommendations for next time — no separate action needed there.`
  );

  return (
    <div>
      {myRow && (
        <div style={{ ...styles.panel, marginBottom: 16 }}>
          <div style={styles.panelTitle}>Your draft, in short</div>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            <ClockStat label="Starter Rank" value={`#${myStarterRank} / ${order.length}`} />
            <ClockStat label="Starter Pts" value={myRow.starterPoints.toFixed(1)} />
            <ClockStat label="Players Drafted" value={myRow.playerCount} />
          </div>
        </div>
      )}

      <div style={{ ...styles.panel, marginBottom: 16 }}>
        <div style={styles.panelTitle}>Positional draft trends this year</div>
        <p style={{ color: "#7d8599", fontSize: 12.5, marginTop: -4, marginBottom: 8 }}>
          Average overall pick number by position, across every team this draft.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {posTrendSorted.map((pt) => (
            <div key={pt.pos} style={styles.recRow}>
              <PosPill pos={pt.pos} />
              <span style={{ flex: 1, marginLeft: 8 }}>{pt.pos}</span>
              <span style={styles.mono}>avg pick {pt.avgPick.toFixed(1)}</span>
            </div>
          ))}
        </div>
      </div>

      {myPosBreakdown && (
        <div style={{ ...styles.panel, marginBottom: 16 }}>
          <div style={styles.panelTitle}>Your position investment vs. league average</div>
          <div style={styles.tableWrap}>
            <table style={styles.table}>
              <thead>
                <tr>
                  <th style={styles.th}>Pos</th>
                  <th style={styles.thNum} title="Total scarcity value of all your drafted players at this position">
                    Your Scarcity Value
                  </th>
                  <th style={styles.thNum} title="Average total scarcity value spent at this position, across all teams">
                    League Avg/Team
                  </th>
                  <th style={styles.thNum} title="Yours minus the league average — positive means you invested more here than most">
                    Difference
                  </th>
                </tr>
              </thead>
              <tbody>
                {myPosBreakdown.map((r) => (
                  <tr key={r.pos} style={{ ...styles.tr, cursor: "default" }}>
                    <td style={styles.td}>
                      <PosPill pos={r.pos} />
                    </td>
                    <td style={styles.tdNum}>{r.mine.toFixed(0)}</td>
                    <td style={styles.tdNum}>{r.leagueAvgPerTeam.toFixed(0)}</td>
                    <td style={{ ...styles.tdNum, color: r.diff >= 0 ? "#5fd685" : "#e46a5c" }}>
                      {r.diff >= 0 ? "+" : ""}
                      {r.diff.toFixed(0)}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Tips for next year</div>
        <ul style={{ margin: 0, paddingLeft: 18, display: "flex", flexDirection: "column", gap: 8 }}>
          {tips.map((tip, i) => (
            <li key={i} style={{ fontSize: 13.5, color: "#c7cede", lineHeight: 1.5 }}>
              {tip}
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

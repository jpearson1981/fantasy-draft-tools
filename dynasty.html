const FLEX_ELIGIBLE = ["RB", "WR", "TE"];
const SUPERFLEX_ELIGIBLE = ["QB", "RB", "WR", "TE"];

function tierFor(vbd) {
  if (vbd >= 150) return "Tier 1";
  if (vbd >= 100) return "Tier 2";
  if (vbd >= 60) return "Tier 3";
  if (vbd >= 30) return "Tier 4";
  return "Tier 5";
}

function computeRankings(base) {
  // base: [{name, position, points}] — returns fully computed player objects
  const players = base.map((p) => ({ ...p }));
  const byPos = {};
  players.forEach((p) => {
    if (!byPos[p.position]) byPos[p.position] = [];
    byPos[p.position].push(p);
  });
  Object.keys(byPos).forEach((pos) => {
    byPos[pos].sort((a, b) => b.points - a.points);
    byPos[pos].forEach((p, i) => {
      p.posRank = i + 1;
    });
  });

  const replValue = {};
  Object.keys(REPL_RANK).forEach((pos) => {
    const list = byPos[pos] || [];
    const rank = REPL_RANK[pos];
    const idx = Math.min(rank, list.length) - 1;
    replValue[pos] = idx >= 0 ? list[idx].points : 0;
  });

  players.forEach((p) => {
    p.vbd = p.points - (replValue[p.position] ?? 0);
    p.tier = tierFor(p.vbd);
  });

  // Self-calibrating budget split: the league only has $LEAGUE_BUDGET total to
  // spend across ROSTER_SPOTS × TEAMS_COUNT players. Anyone at or below
  // replacement level realistically just costs $1 to roster — so back that
  // guaranteed $1-per-filler-spot cost out of the pool first, then divide the
  // REMAINING budget proportionally among players who actually have positive
  // value. This keeps the model's total assigned spending equal to the real
  // total budget (previously a fixed 0.699 coefficient left ~20% of the
  // league's real spending unaccounted for, which is what made every team's
  // Draft Value look negative on the Draft Analysis tab).
  const draftPoolSize = ROSTER_SPOTS * TEAMS_COUNT;
  const positiveVbdCount = players.filter((p) => p.vbd > 0).length;
  const fillerCount = Math.max(0, draftPoolSize - positiveVbdCount);
  const budgetForValuePlayers = LEAGUE_BUDGET - fillerCount * 1;
  const totalVbd = players.reduce((s, p) => s + Math.max(0, p.vbd), 0) || 1;
  players.forEach((p) => {
    const vbdPct = Math.max(0, p.vbd) / totalVbd;
    p.auctionValue = Math.max(1, Math.round(vbdPct * budgetForValuePlayers));
    p.maxBid = Math.round(p.auctionValue * 1.1);
  });

  // Calibrate toward real market prices: blend the formulaic auction value with
  // what players at that position + position-rank actually sold for over the
  // last 4 drafts. More years of consistent data at a rank = more trust in the
  // historical number; sparse/no data (deep bench ranks) leans on the formula.
  players.forEach((p) => {
    const h = HISTORICAL_SALARY[p.position] && HISTORICAL_SALARY[p.position][p.posRank];
    if (!h) return;
    const [histAvg, histMax, years] = h;
    const weight = years >= 3 ? 0.5 : years === 2 ? 0.4 : 0.3;
    const formulaMaxBid = Math.round(p.auctionValue * 1.1);
    p.auctionValue = Math.max(1, Math.round(p.auctionValue * (1 - weight) + histAvg * weight));
    // Historical MAX at a rank is a single-season data point with only 4 years on
    // file — it's noisy, so it's blended the same gentle way rather than used as a
    // hard floor (a hard floor let one outlier bidding war years ago set an
    // inflated ceiling for every future player who happens to land that rank).
    p.maxBid = Math.max(p.auctionValue, Math.round(formulaMaxBid * (1 - weight) + histMax * weight));
  });

  // Safety net: within a position, a lower-projected player should never end up
  // with a higher auction value or max bid than someone projected for more points
  // — clamp any inversions the historical blend above might introduce.
  Object.keys(byPos).forEach((pos) => {
    const list = byPos[pos];
    for (let i = 1; i < list.length; i++) {
      if (list[i].auctionValue > list[i - 1].auctionValue) {
        list[i].auctionValue = list[i - 1].auctionValue;
      }
      if (list[i].maxBid > list[i - 1].maxBid) {
        list[i].maxBid = list[i - 1].maxBid;
      }
    }
  });

  const scarcityD = {};
  Object.keys(STARTERS_REQ).forEach((pos) => {
    const list = byPos[pos] || [];
    const B = STARTERS_REQ[pos];
    const top = list.filter((p) => p.posRank <= B);
    const sum = top.reduce((s, p) => s + p.vbd, 0);
    scarcityD[pos] = B > 0 ? sum / B : 0;
  });
  const mult = {};
  Object.keys(STARTERS_REQ).forEach((pos) => {
    const d = scarcityD[pos];
    if (pos === "K") mult[pos] = 0.01 + d * 0.25;
    else if (pos === "DEF") mult[pos] = 0.1 + d * 0.25;
    else mult[pos] = 1 + d * 0.25;
  });
  // K/DEF scarcity gets dampened further on top of the base formula above —
  // both positions are deep and replaceable all season, so their scarcity
  // value shouldn't compete with skill positions late in the draft.
  const SCARCITY_DAMPEN = { TE: 0.65, K: 0.15, DEF: 0.15 };
  const belowReplacementAnchor = Math.max(...players.map((p) => p.points), 0) + 1;
  players.forEach((p) => {
    // Only amplify/dampen VBD that's actually above replacement level. Applying
    // a position multiplier to a NEGATIVE VBD inverts its intent — a bigger
    // multiplier on a "less bad" number can end up more negative than a small
    // multiplier on a "more bad" number, which is exactly how deep bench players
    // at scarce-but-thin positions were sneaking ahead of players with real,
    // meaningful point projections. Below replacement, VBD is still relative
    // to each position's own replacement baseline, which can make a 0-point
    // player at a thin position look "less bad" than a mediocre player at a
    // deep one purely from differing baselines — not what "low point
    // projection" should mean. So below replacement, rank on raw points
    // instead (shifted to stay below every above-replacement score), which
    // puts 0-point players at the true bottom regardless of position.
    p.scarcity =
      p.vbd > 0
        ? p.vbd * (mult[p.position] ?? 1) * (SCARCITY_DAMPEN[p.position] ?? 1)
        : p.points - belowReplacementAnchor;
  });

  return players.map((p) => ({
    id: p.name,
    name: p.name,
    position: p.position,
    points: p.points,
    vbd: p.vbd,
    tier: p.tier,
    auctionValue: p.auctionValue,
    maxBid: p.maxBid,
    scarcity: p.scarcity,
  }));
}

/* ---------------------------------------------------------
   Starting lineup assignment — given a team's drafted/kept entries,
   fills required slots with the highest-points eligible player at
   each, then FLEX, then SUPERFLEX, leaving the rest on the bench.
   Shared by the Team Rosters and Draft Analysis views.
---------------------------------------------------------- */
function buildLineup(entries, players, req) {
  const withData = entries
    .map((e) => ({ ...e, player: players.find((p) => p.id === e.playerId) }))
    .filter((e) => e.player);

  const used = new Set();
  const takeBest = (positions) => {
    const candidates = withData.filter((e) => positions.includes(e.player.position) && !used.has(e.playerId));
    candidates.sort((a, b) => b.player.points - a.player.points);
    return candidates[0] || null;
  };

  const slots = [];
  ["QB", "RB", "WR", "TE", "K", "DEF"].forEach((pos) => {
    const count = req[pos] || 0;
    for (let i = 0; i < count; i++) {
      const best = takeBest([pos]);
      if (best) used.add(best.playerId);
      slots.push({ label: `${pos}${i + 1}`, entry: best });
    }
  });
  for (let i = 0; i < (req.FLEX || 0); i++) {
    const best = takeBest(FLEX_ELIGIBLE);
    if (best) used.add(best.playerId);
    slots.push({ label: `FLEX${i + 1}`, entry: best });
  }
  for (let i = 0; i < (req.SUPERFLEX || 0); i++) {
    const best = takeBest(SUPERFLEX_ELIGIBLE);
    if (best) used.add(best.playerId);
    slots.push({ label: `SFLX${i + 1}`, entry: best });
  }

  const POSITION_ORDER = { QB: 0, RB: 1, WR: 2, TE: 3, K: 4, DEF: 5 };
  const bench = withData
    .filter((e) => !used.has(e.playerId))
    .sort((a, b) => {
      const posDiff = (POSITION_ORDER[a.player.position] ?? 9) - (POSITION_ORDER[b.player.position] ?? 9);
      if (posDiff !== 0) return posDiff;
      return b.player.points - a.player.points;
    });

  const starterPoints = slots.reduce((s, sl) => s + (sl.entry ? sl.entry.player.points : 0), 0);

  return { slots, bench, starterPoints };
}


/* ---------------------------------------------------------
   CSV helpers (projections import, results export)
---------------------------------------------------------- */
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map((h) => h.trim().replace(/^"|"$/g, "").toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(",").map((c) => c.trim().replace(/^"|"$/g, ""));
    const row = {};
    headers.forEach((h, idx) => {
      row[h] = cells[idx];
    });
    rows.push(row);
  }
  return rows;
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function fmtMoney(n) {
  return "$" + Math.round(n).toLocaleString();
}

   Persistence helpers
---------------------------------------------------------- */
async function loadState() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    /* no saved state yet, or storage unavailable */
  }
  return null;
}
async function saveState(state) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    /* best effort */
  }
}

function App() {
  const [ready, setReady] = useState(false);
  const [stage, setStage] = useState("setup"); // setup | draft
  const [teams, setTeams] = useState(
    DEFAULT_TEAM_NAMES.map((name, i) => ({ id: i, name }))
  );
  const [order, setOrder] = useState(DEFAULT_TEAM_NAMES.map((_, i) => i));
  const [keepers, setKeepers] = useState([]); // {playerId, teamId, cost}
  const [potentialKeepers, setPotentialKeepers] = useState([]); // {playerId, teamId, cost}
  const [picks, setPicks] = useState([]); // {playerId, teamId, cost, pickNum}
  const [players, setPlayers] = useState(() => computeRankings(DEFAULT_BASE));
  const [projMsg, setProjMsg] = useState("");
  const [myTeamId, setMyTeamId] = useState(null);

  const saveTimer = useRef(null);

  // load persisted state once (same-browser convenience autosave)
  useEffect(() => {
    (async () => {
      const saved = await loadState();
      if (saved) {
        setStage(saved.stage || "setup");
        if (saved.teams) setTeams(saved.teams);
        if (saved.order) setOrder(saved.order);
        if (saved.keepers) setKeepers(saved.keepers);
        if (saved.potentialKeepers) setPotentialKeepers(saved.potentialKeepers);
        if (saved.picks) setPicks(saved.picks);
        if (saved.playerBase) setPlayers(computeRankings(saved.playerBase));
        if (saved.myTeamId !== undefined) setMyTeamId(saved.myTeamId);
      }
      setReady(true);
    })();
    // eslint-disable-next-line
  }, []);

  // debounce-save whenever anything changes
  useEffect(() => {
    if (!ready) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveState({
        stage,
        teams,
        order,
        keepers,
        potentialKeepers,
        picks,
        playerBase: players.map((p) => ({ name: p.name, position: p.position, points: p.points })),
        myTeamId,
      });
    }, 300);
    return () => clearTimeout(saveTimer.current);
  }, [ready, stage, teams, order, keepers, potentialKeepers, picks, players, myTeamId]);

  const handleUpdateProjections = useCallback(
    (file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rows = parseCSV(String(e.target.result));
          if (rows.length === 0) {
            setProjMsg("Couldn't find any data rows in that file.");
            return;
          }
          const headers = Object.keys(rows[0]);
          const playerKey = headers.find((h) => h.includes("player") || h === "name");
          const pointsKey = headers.find((h) => h.includes("point"));
          const positionKey = headers.find((h) => h.includes("position") || h === "pos");
          if (!playerKey || !pointsKey) {
            setProjMsg('Need a column with "player" in the header and one with "points".');
            return;
          }
          const draftedIds = new Set([...picks.map((p) => p.playerId), ...keepers.map((k) => k.playerId)]);
          const knownNames = new Set(players.map((p) => p.name));
          const csvNames = new Set(); // every name that appeared in the upload
          const updates = {}; // name -> points, for players already in the pool
          const newPlayers = []; // {name, position, points} for names not yet in the pool
          const seenNew = new Set();
          let skippedNoPosition = 0;

          rows.forEach((r) => {
            const name = (r[playerKey] || "").trim();
            const pts = parseFloat(r[pointsKey]);
            if (!name || !Number.isFinite(pts)) return;
            csvNames.add(name);
            if (knownNames.has(name)) {
              updates[name] = pts;
              return;
            }
            const rawPos = positionKey ? (r[positionKey] || "").trim().toUpperCase() : "";
            if (POSITIONS.includes(rawPos)) {
              if (!seenNew.has(name)) {
                seenNew.add(name);
                newPlayers.push({ name, position: rawPos, points: pts });
              }
            } else {
              skippedNoPosition++;
            }
          });

          // Full replace: anyone not in the new file gets dropped from the pool —
          // except a player who's already been kept or drafted, since removing
          // them would corrupt existing rosters/picks that reference them.
          let removed = 0;
          let keptAnyway = 0;
          const base = [];
          players.forEach((p) => {
            if (csvNames.has(p.name)) {
              base.push({
                name: p.name,
                position: p.position,
                points: Object.prototype.hasOwnProperty.call(updates, p.name) ? updates[p.name] : p.points,
              });
            } else if (draftedIds.has(p.id)) {
              keptAnyway++;
              base.push({ name: p.name, position: p.position, points: p.points });
            } else {
              removed++;
            }
          });
          base.push(...newPlayers);

          setPlayers(computeRankings(base));

          const matched = Object.keys(updates).length;
          let msg = `Updated ${matched} player${matched === 1 ? "" : "s"}.`;
          if (newPlayers.length > 0) {
            msg += ` Added ${newPlayers.length} new player${newPlayers.length === 1 ? "" : "s"}.`;
          }
          if (removed > 0) {
            msg += ` Removed ${removed} player${removed === 1 ? "" : "s"} not on the new list.`;
          }
          if (keptAnyway > 0) {
            msg += ` Kept ${keptAnyway} already-drafted player${
              keptAnyway === 1 ? "" : "s"
            } that weren't on the new list — can't drop a player once they're rostered.`;
          }
          if (skippedNoPosition > 0) {
            msg += ` ${skippedNoPosition} row${skippedNoPosition === 1 ? "" : "s"} couldn't be added — include a "Position" column (QB/RB/WR/TE/K/DEF) to add new players.`;
          }
          setProjMsg(msg);
        } catch (err) {
          setProjMsg("Couldn't read that file — make sure it's a CSV export.");
        }
      };
      reader.readAsText(file);
    },
    [players, picks, keepers]
  );

  const [addPlayerMsg, setAddPlayerMsg] = useState("");
  const handleAddCustomPlayer = useCallback(
    (name, position) => {
      const trimmed = name.trim();
      if (!trimmed) {
        setAddPlayerMsg("Enter a player name.");
        return;
      }
      if (players.some((p) => p.name.toLowerCase() === trimmed.toLowerCase())) {
        setAddPlayerMsg(`"${trimmed}" is already in the player pool.`);
        return;
      }
      const base = players.map((p) => ({ name: p.name, position: p.position, points: p.points }));
      base.push({ name: trimmed, position, points: 0 });
      setPlayers(computeRankings(base));
      setAddPlayerMsg(`Added ${trimmed} (${position}) at 0 projected points.`);
    },
    [players]
  );

  const [potentialKeeperMsg, setPotentialKeeperMsg] = useState("");
  const handleBulkPotentialKeepers = useCallback(
    (file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rows = parseCSV(String(e.target.result));
          if (rows.length === 0) {
            setPotentialKeeperMsg("Couldn't find any data rows in that file.");
            return;
          }
          const headers = Object.keys(rows[0]);
          const playerKey = headers.find((h) => h.includes("player") || h === "name");
          const teamKey = headers.find((h) => h.includes("team"));
          const costKey = headers.find((h) => h.includes("cost") || h.includes("price") || h.includes("salary"));
          if (!playerKey || !teamKey || !costKey) {
            setPotentialKeeperMsg('Need columns for "Player", "Team", and "Cost".');
            return;
          }
          const added = [];
          const errors = [];
          rows.forEach((r, idx) => {
            const name = (r[playerKey] || "").trim();
            const teamName = (r[teamKey] || "").trim();
            const cost = parseInt(r[costKey], 10);
            if (!name) return;
            const player = players.find((p) => p.name === name);
            if (!player) {
              errors.push(`Row ${idx + 2}: "${name}" doesn't match any player in the pool.`);
              return;
            }
            const team = teams.find((t) => t.name.toLowerCase() === teamName.toLowerCase());
            if (!team) {
              errors.push(`Row ${idx + 2}: "${teamName}" doesn't match any team.`);
              return;
            }
            if (!Number.isFinite(cost) || cost < 1) {
              errors.push(`Row ${idx + 2}: invalid cost for "${name}".`);
              return;
            }
            added.push({ playerId: player.id, teamId: team.id, cost });
          });
          setPotentialKeepers((prev) => [...prev, ...added]);
          let msg = `Added ${added.length} potential keeper${added.length === 1 ? "" : "s"}.`;
          if (errors.length > 0) {
            msg += ` ${errors.length} row${errors.length === 1 ? "" : "s"} had errors: ${errors.slice(0, 5).join(" ")}`;
            if (errors.length > 5) msg += ` (+${errors.length - 5} more)`;
          }
          setPotentialKeeperMsg(msg);
        } catch (err) {
          setPotentialKeeperMsg("Couldn't read that file — make sure it's a CSV export.");
        }
      };
      reader.readAsText(file);
    },
    [players, teams]
  );

  const [keeperUploadMsg, setKeeperUploadMsg] = useState("");
  const handleBulkKeepers = useCallback(
    (file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rows = parseCSV(String(e.target.result));
          if (rows.length === 0) {
            setKeeperUploadMsg("Couldn't find any data rows in that file.");
            return;
          }
          const headers = Object.keys(rows[0]);
          const playerKey = headers.find((h) => h.includes("player") || h === "name");
          const teamKey = headers.find((h) => h.includes("team"));
          const costKey = headers.find((h) => h.includes("cost") || h.includes("price") || h.includes("salary"));
          if (!playerKey || !teamKey || !costKey) {
            setKeeperUploadMsg('Need columns for "Player", "Team", and "Cost".');
            return;
          }
          // Running totals per team, seeded from existing keepers + picks, so
          // budget/roster caps are enforced correctly as rows accumulate.
          const spentByTeam = {};
          const countByTeam = {};
          teams.forEach((t) => {
            spentByTeam[t.id] = 0;
            countByTeam[t.id] = 0;
          });
          keepers.forEach((k) => {
            spentByTeam[k.teamId] = (spentByTeam[k.teamId] || 0) + k.cost;
            countByTeam[k.teamId] = (countByTeam[k.teamId] || 0) + 1;
          });
          picks.forEach((p) => {
            spentByTeam[p.teamId] = (spentByTeam[p.teamId] || 0) + p.cost;
            countByTeam[p.teamId] = (countByTeam[p.teamId] || 0) + 1;
          });
          const usedPlayerIds = new Set([...keepers.map((k) => k.playerId), ...picks.map((p) => p.playerId)]);

          const added = [];
          const errors = [];
          rows.forEach((r, idx) => {
            const name = (r[playerKey] || "").trim();
            const teamName = (r[teamKey] || "").trim();
            const cost = parseInt(r[costKey], 10);
            if (!name) return;
            const player = players.find((p) => p.name === name);
            if (!player) {
              errors.push(`Row ${idx + 2}: "${name}" doesn't match any player in the pool.`);
              return;
            }
            if (usedPlayerIds.has(player.id)) {
              errors.push(`Row ${idx + 2}: "${name}" is already kept or drafted.`);
              return;
            }
            const team = teams.find((t) => t.name.toLowerCase() === teamName.toLowerCase());
            if (!team) {
              errors.push(`Row ${idx + 2}: "${teamName}" doesn't match any team.`);
              return;
            }
            if (!Number.isFinite(cost) || cost < 1) {
              errors.push(`Row ${idx + 2}: invalid cost for "${name}".`);
              return;
            }
            if (countByTeam[team.id] >= ROSTER_SPOTS) {
              errors.push(`Row ${idx + 2}: ${team.name}'s roster is already full — skipped "${name}".`);
              return;
            }
            if (spentByTeam[team.id] + cost > BUDGET_PER_TEAM) {
              errors.push(
                `Row ${idx + 2}: ${team.name} would go over the $${BUDGET_PER_TEAM} cap — skipped "${name}".`
              );
              return;
            }
            added.push({ playerId: player.id, teamId: team.id, cost });
            usedPlayerIds.add(player.id);
            spentByTeam[team.id] += cost;
            countByTeam[team.id] += 1;
          });
          setKeepers((prev) => [...prev, ...added]);
          let msg = `Added ${added.length} keeper${added.length === 1 ? "" : "s"}.`;
          if (errors.length > 0) {
            msg += ` ${errors.length} row${errors.length === 1 ? "" : "s"} had errors: ${errors.slice(0, 5).join(" ")}`;
            if (errors.length > 5) msg += ` (+${errors.length - 5} more)`;
          }
          setKeeperUploadMsg(msg);
        } catch (err) {
          setKeeperUploadMsg("Couldn't read that file — make sure it's a CSV export.");
        }
      };
      reader.readAsText(file);
    },
    [players, teams, keepers, picks]
  );

  const handleSaveFile = useCallback(() => {
    const payload = {
      savedAt: new Date().toISOString(),
      teams,
      order,
      keepers,
      potentialKeepers,
      picks,
      playerBase: players.map((p) => ({ name: p.name, position: p.position, points: p.points })),
      myTeamId,
    };
    downloadBlob(JSON.stringify(payload, null, 2), "dynasty-draft-save.json", "application/json");
  }, [teams, order, keepers, potentialKeepers, picks, players, myTeamId]);

  const handleLoadFile = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(String(e.target.result));
        if (data.teams) setTeams(data.teams);
        if (data.order) setOrder(data.order);
        setKeepers(data.keepers || []);
        setPotentialKeepers(data.potentialKeepers || []);
        setPicks(data.picks || []);
        if (data.playerBase) setPlayers(computeRankings(data.playerBase));
        setMyTeamId(data.myTeamId !== undefined ? data.myTeamId : null);
        setStage(data.picks && data.picks.length > 0 ? "draft" : "setup");
      } catch (err) {
        window.alert("Couldn't read that file — is it a save file from this tool?");
      }
    };
    reader.readAsText(file);
  }, []);

  const handleExportResults = useCallback(() => {
    const rows = [["Team", "Player", "Position", "Type", "Cost"]];
    keepers.forEach((k) => {
      const p = players.find((pp) => pp.id === k.playerId);
      const t = teams.find((tt) => tt.id === k.teamId);
      rows.push([t?.name || "", p?.name || "", p?.position || "", "Keeper", k.cost]);
    });
    picks
      .slice()
      .sort((a, b) => a.pickNum - b.pickNum)
      .forEach((pk) => {
        const p = players.find((pp) => pp.id === pk.playerId);
        const t = teams.find((tt) => tt.id === pk.teamId);
        rows.push([t?.name || "", p?.name || "", p?.position || "", "Draft", pk.cost]);
      });
    const csv = rows
      .map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    downloadBlob(csv, "dynasty-draft-results.csv", "text/csv");
  }, [keepers, picks, players, teams]);

  const handleClearAll = useCallback(async () => {
    setTeams(DEFAULT_TEAM_NAMES.map((name, i) => ({ id: i, name })));
    setOrder(DEFAULT_TEAM_NAMES.map((_, i) => i));
    setKeepers([]);
    setPotentialKeepers([]);
    setPicks([]);
    setPlayers(computeRankings(DEFAULT_BASE));
    setProjMsg("");
    setMyTeamId(null);
    setStage("setup");
    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      /* best effort */
    }
  }, []);

  if (!ready) {
    return (
      <div style={styles.loadingScreen}>
        <div style={styles.loadingSpinner} />
        <div style={{ color: "#8b93a7", fontSize: 14, marginTop: 12 }}>
          Loading draft room…
        </div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <GlobalStyle />
      <UtilityBar
        onSave={handleSaveFile}
        onLoad={handleLoadFile}
        onExport={handleExportResults}
        onClearAll={handleClearAll}
        hasResults={keepers.length > 0 || picks.length > 0}
      />
      {stage === "setup" ? (
        <SetupScreen
          teams={teams}
          setTeams={setTeams}
          order={order}
          setOrder={setOrder}
          players={players}
          keepers={keepers}
          setKeepers={setKeepers}
          onBulkKeepers={handleBulkKeepers}
          keeperUploadMsg={keeperUploadMsg}
          potentialKeepers={potentialKeepers}
          setPotentialKeepers={setPotentialKeepers}
          onBulkPotentialKeepers={handleBulkPotentialKeepers}
          potentialKeeperMsg={potentialKeeperMsg}
          picks={picks}
          picksExist={picks.length > 0}
          onStart={() => setStage("draft")}
          onResetDraft={() => setPicks([])}
          onUpdateProjections={handleUpdateProjections}
          projMsg={projMsg}
        />
      ) : (
        <DraftScreen
          teams={teams}
          order={order}
          keepers={keepers}
          picks={picks}
          setPicks={setPicks}
          players={players}
          onEditSetup={() => setStage("setup")}
          onAddCustomPlayer={handleAddCustomPlayer}
          addPlayerMsg={addPlayerMsg}
          myTeamId={myTeamId}
          setMyTeamId={setMyTeamId}
        />
      )}
    </div>
  );
}

function UtilityBar({ onSave, onLoad, onExport, onClearAll, hasResults }) {
  const loadInputRef = useRef(null);
  return (
    <div style={styles.utilityBar}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#5f6779", letterSpacing: 0.5 }}>
        DYNASTY DRAFT TOOL
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button style={styles.ghostBtnSm} onClick={onSave}>
          Save file
        </button>
        <button style={styles.ghostBtnSm} onClick={() => loadInputRef.current?.click()}>
          Load file
        </button>
        <input
          ref={loadInputRef}
          type="file"
          accept=".json"
          style={{ display: "none" }}
          onChange={(e) => {
            const f = e.target.files?.[0];
            if (f) onLoad(f);
            e.target.value = "";
          }}
        />
        {hasResults && (
          <button style={styles.ghostBtnSm} onClick={onExport}>
            Export results (CSV)
          </button>
        )}
        <button
          style={styles.dangerGhostBtnSm}
          onClick={() => {
            if (
              window.confirm(
                "Clear EVERYTHING? This wipes all teams, order, keepers, picks, and any updated projections, and resets this tool to a blank Dynasty draft. This can't be undone — save a file first if you want a backup."
              )
            ) {
              onClearAll();
            }
          }}
        >
          Clear all data
        </button>
      </div>
    </div>
  );
}

function GlobalStyle() {
  return (
    <style>{`
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #333c4d; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      input, select, button { font-family: inherit; }
      button:focus-visible, input:focus-visible, select:focus-visible {
        outline: 2px solid #e0b34a; outline-offset: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
      @keyframes ticker-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 760px) {
        .setup-grid { grid-template-columns: 1fr !important; }
        .board-layout { grid-template-columns: 1fr !important; }
        .clock-bar { flex-direction: column; align-items: flex-start !important; }
        .clock-stats { gap: 16px !important; }
      }
    `}</style>
  );
}

/* ---------------------------------------------------------
   SETUP SCREEN
---------------------------------------------------------- */
function SetupScreen({
  teams,
  setTeams,
  order,
  setOrder,
  players,
  keepers,
  setKeepers,
  onBulkKeepers,
  keeperUploadMsg,
  potentialKeepers,
  setPotentialKeepers,
  onBulkPotentialKeepers,
  potentialKeeperMsg,
  picks,
  picksExist,
  onStart,
  onResetDraft,
  onUpdateProjections,
  projMsg,
}) {
  const renameTeam = (id, name) => {
    setTeams(teams.map((t) => (t.id === id ? { ...t, name } : t)));
  };

  const moveInOrder = (idx, dir) => {
    const next = [...order];
    const swap = idx + dir;
    if (swap < 0 || swap >= next.length) return;
    [next[idx], next[swap]] = [next[swap], next[idx]];
    setOrder(next);
  };

  const shuffle = () => {
    const next = [...order];
    for (let i = next.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [next[i], next[j]] = [next[j], next[i]];
    }
    setOrder(next);
  };

  const [dragIndex, setDragIndex] = useState(null);
  const [dragOverIndex, setDragOverIndex] = useState(null);
  const handleDragStart = (idx) => (e) => {
    setDragIndex(idx);
    e.dataTransfer.effectAllowed = "move";
  };
  const handleDragOver = (idx) => (e) => {
    e.preventDefault();
    if (idx !== dragOverIndex) setDragOverIndex(idx);
  };
  const handleDrop = (idx) => (e) => {
    e.preventDefault();
    if (dragIndex === null || dragIndex === idx) {
      setDragIndex(null);
      setDragOverIndex(null);
      return;
    }
    const next = [...order];
    const [moved] = next.splice(dragIndex, 1);
    next.splice(idx, 0, moved);
    setOrder(next);
    setDragIndex(null);
    setDragOverIndex(null);
  };
  const handleDragEnd = () => {
    setDragIndex(null);
    setDragOverIndex(null);
  };

  const teamById = (id) => teams.find((t) => t.id === id);

  // ---- Keepers ----
  const [keeperQuery, setKeeperQuery] = useState("");
  const [keeperPlayerId, setKeeperPlayerId] = useState(null);
  const [keeperTeamId, setKeeperTeamId] = useState(order[0] ?? teams[0]?.id ?? null);
  const [keeperCost, setKeeperCost] = useState("");
  const [keeperError, setKeeperError] = useState("");

  const lockedIds = useMemo(() => {
    const s = new Set(keepers.map((k) => k.playerId));
    picks.forEach((p) => s.add(p.playerId));
    return s;
  }, [keepers, picks]);

  const keeperResults = useMemo(() => {
    if (!keeperQuery.trim()) return [];
    const q = keeperQuery.trim().toLowerCase();
    return players.filter((p) => !lockedIds.has(p.id) && p.name.toLowerCase().includes(q)).slice(0, 8);
  }, [keeperQuery, players, lockedIds]);

  const keeperSpent = (teamId) =>
    keepers.filter((k) => k.teamId === teamId).reduce((s, k) => s + k.cost, 0) +
    picks.filter((p) => p.teamId === teamId).reduce((s, p) => s + p.cost, 0);
  const keeperCount = (teamId) =>
    keepers.filter((k) => k.teamId === teamId).length + picks.filter((p) => p.teamId === teamId).length;

  const addKeeper = () => {
    setKeeperError("");
    if (keeperPlayerId === null) {
      setKeeperError("Search for and select a player first.");
      return;
    }
    if (keeperTeamId === null) {
      setKeeperError("Choose which team kept them.");
      return;
    }
    const cost = parseInt(keeperCost, 10);
    if (!Number.isFinite(cost) || cost < 1) {
      setKeeperError("Enter a keeper cost of at least $1.");
      return;
    }
    if (keeperCount(keeperTeamId) >= ROSTER_SPOTS) {
      setKeeperError(`${teamById(keeperTeamId)?.name}'s roster is already full.`);
      return;
    }
    if (keeperSpent(keeperTeamId) + cost > BUDGET_PER_TEAM) {
      setKeeperError(
        `That puts ${teamById(keeperTeamId)?.name} over the $${BUDGET_PER_TEAM} cap (already committed $${keeperSpent(
          keeperTeamId
        )}).`
      );
      return;
    }
    setKeepers([...keepers, { playerId: keeperPlayerId, teamId: keeperTeamId, cost }]);
    setKeeperPlayerId(null);
    setKeeperQuery("");
    setKeeperCost("");
  };

  const removeKeeper = (idx) => {
    setKeepers(keepers.filter((_, i) => i !== idx));
  };
  const keeperCsvInputRef = useRef(null);

  // ---- Potential keepers (staging area — doesn't count against budget/roster
  // until promoted into the real Keepers list below) ----
  const [potQuery, setPotQuery] = useState("");
  const [potPlayerId, setPotPlayerId] = useState(null);
  const [potTeamId, setPotTeamId] = useState(order[0] ?? teams[0]?.id ?? null);
  const [potCost, setPotCost] = useState("");
  const [potError, setPotError] = useState("");
  const potCsvInputRef = useRef(null);

  const potLockedIds = useMemo(() => {
    const s = new Set(lockedIds);
    potentialKeepers.forEach((pk) => s.add(pk.playerId));
    return s;
  }, [lockedIds, potentialKeepers]);

  const potResults = useMemo(() => {
    if (!potQuery.trim()) return [];
    const q = potQuery.trim().toLowerCase();
    return players.filter((p) => !potLockedIds.has(p.id) && p.name.toLowerCase().includes(q)).slice(0, 8);
  }, [potQuery, players, potLockedIds]);

  const addPotentialKeeper = () => {
    setPotError("");
    if (potPlayerId === null) {
      setPotError("Search for and select a player first.");
      return;
    }
    if (potTeamId === null) {
      setPotError("Choose which team might keep them.");
      return;
    }
    const cost = parseInt(potCost, 10);
    if (!Number.isFinite(cost) || cost < 1) {
      setPotError("Enter a keeper cost of at least $1.");
      return;
    }
    setPotentialKeepers([...potentialKeepers, { playerId: potPlayerId, teamId: potTeamId, cost }]);
    setPotPlayerId(null);
    setPotQuery("");
    setPotCost("");
  };

  const removePotentialKeeper = (idx) => {
    setPotentialKeepers(potentialKeepers.filter((_, i) => i !== idx));
  };

  const promoteToKeeper = (idx) => {
    const pk = potentialKeepers[idx];
    setPotError("");
    if (keeperCount(pk.teamId) >= ROSTER_SPOTS) {
      setPotError(`${teamById(pk.teamId)?.name}'s roster is already full — can't keep this one too.`);
      return;
    }
    if (keeperSpent(pk.teamId) + pk.cost > BUDGET_PER_TEAM) {
      setPotError(
        `Keeping this would put ${teamById(pk.teamId)?.name} over the $${BUDGET_PER_TEAM} cap (already committed $${keeperSpent(
          pk.teamId
        )}).`
      );
      return;
    }
    setKeepers([...keepers, { playerId: pk.playerId, teamId: pk.teamId, cost: pk.cost }]);
    setPotentialKeepers(potentialKeepers.filter((_, i) => i !== idx));
  };

  // ---- Projections update ----
  const projInputRef = useRef(null);

  return (
    <div style={styles.setupWrap}>
      <div style={styles.setupHeader}>
        <div style={{ ...styles.eyebrow }}>DYNASTY LEAGUE · AUCTION DRAFT</div>
        <h1 style={styles.h1}>Set the room before the clock starts</h1>
        <p style={{ color: "#8b93a7", fontSize: 15, maxWidth: 560, lineHeight: 1.5 }}>
          Confirm your 12 teams, nomination order, and any keepers already locked
          in. $250 cap per team, 17 roster spots.
        </p>
      </div>

      <section style={styles.panel}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={styles.panelTitle}>Teams & nomination order</div>
          <button style={styles.ghostBtnSm} onClick={shuffle}>
            Shuffle order
          </button>
        </div>
        <p style={{ color: "#7d8599", fontSize: 12.5, marginTop: -4, marginBottom: 8 }}>
          Drag a row to reorder, use the arrows, or rename a team right in its row.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {order.map((teamId, idx) => (
            <div
              key={teamId}
              draggable
              onDragStart={handleDragStart(idx)}
              onDragOver={handleDragOver(idx)}
              onDrop={handleDrop(idx)}
              onDragEnd={handleDragEnd}
              style={{
                ...styles.orderRow,
                opacity: dragIndex === idx ? 0.35 : 1,
                border: dragOverIndex === idx && dragIndex !== idx ? "1px solid #e0b34a" : "1px solid #232a38",
              }}
            >
              <span style={styles.dragHandle} title="Drag to reorder">
                ⠿
              </span>
              <span style={styles.orderNum}>{idx + 1}</span>
              <input
                value={teamById(teamId)?.name ?? ""}
                onChange={(e) => renameTeam(teamId, e.target.value)}
                size={Math.max(3, (teamById(teamId)?.name ?? "").length)}
                style={styles.teamNameInputInline}
              />
              <div style={{ flex: 1 }} />
              <button
                aria-label="Move up"
                draggable={false}
                style={styles.orderArrow}
                onClick={() => moveInOrder(idx, -1)}
                disabled={idx === 0}
              >
                ↑
              </button>
              <button
                aria-label="Move down"
                draggable={false}
                style={styles.orderArrow}
                onClick={() => moveInOrder(idx, 1)}
                disabled={idx === order.length - 1}
              >
                ↓
              </button>
            </div>
          ))}
        </div>
      </section>

      {/* Potential keepers */}
      <section style={{ ...styles.panel, marginTop: 16 }}>
        <div style={styles.panelTitle}>Potential keepers ({potentialKeepers.length})</div>
        <p style={{ color: "#7d8599", fontSize: 13, marginTop: -4, marginBottom: 10 }}>
          Stage every player who's eligible to be kept here first — nothing here counts
          against a team's budget or roster spots yet. Keep Value is modeled auction
          value minus the keeper cost — green means a bargain, red means overpaying.
          When you've decided, click "Keep" to move a candidate into the real Keepers
          list below.
        </p>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
          <div style={{ position: "relative", flex: "1 1 220px", minWidth: 200 }}>
            <input
              placeholder="Search player…"
              value={potQuery}
              onChange={(e) => {
                setPotQuery(e.target.value);
                setPotPlayerId(null);
              }}
              style={styles.nomInput}
            />
            {potQuery && potResults.length > 0 && potPlayerId === null && (
              <div style={styles.searchDropdown}>
                {potResults.map((p) => (
                  <div
                    key={p.id}
                    style={styles.searchResultRow}
                    onClick={() => {
                      setPotPlayerId(p.id);
                      setPotQuery(p.name);
                    }}
                  >
                    <PosPill pos={p.position} />
                    <span style={{ flex: 1 }}>{p.name}</span>
                    <span style={{ color: "#8b93a7", fontSize: 12 }}>Val {fmtMoney(p.auctionValue)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <select
            value={potTeamId ?? ""}
            onChange={(e) => setPotTeamId(parseInt(e.target.value, 10))}
            style={styles.nomSelect}
          >
            {teams.map((t) => (
              <option key={t.id} value={t.id}>
                {t.name}
              </option>
            ))}
          </select>
          <input
            type="number"
            placeholder="Cost $"
            value={potCost}
            onChange={(e) => setPotCost(e.target.value)}
            style={{ ...styles.nomInput, maxWidth: 100, flex: "0 0 100px" }}
          />
          <button style={styles.primaryBtn} onClick={addPotentialKeeper}>
            Add candidate
          </button>
        </div>

        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
          <button style={styles.ghostBtnSm} onClick={() => potCsvInputRef.current?.click()}>
            Upload CSV of candidates
          </button>
          <input
            ref={potCsvInputRef}
            type="file"
            accept=".csv"
            style={{ display: "none" }}
            onChange={(e) => {
              const f = e.target.files?.[0];
              if (f) onBulkPotentialKeepers(f);
              e.target.value = "";
            }}
          />
          <span style={{ fontSize: 12, color: "#5f6779" }}>Columns: Player, Team, Cost</span>
        </div>
        {potentialKeeperMsg && <div style={{ fontSize: 12.5, color: "#8b93a7", marginBottom: 8 }}>{potentialKeeperMsg}</div>}
        {potError && <div style={styles.errorBox}>{potError}</div>}

        {potentialKeepers.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {potentialKeepers.map((pk, idx) => {
              const p = players.find((pp) => pp.id === pk.playerId);
              const t = teamById(pk.teamId);
              const keepValue = p ? p.auctionValue - pk.cost : 0;
              return (
                <div key={idx} style={styles.keeperRow}>
                  <PosPill pos={p?.position} />
                  <span style={{ flex: 1, fontSize: 13, marginLeft: 8 }}>{p?.name}</span>
                  <span style={{ fontSize: 12.5, color: "#8b93a7", marginRight: 10 }}>{t?.name}</span>
                  <span style={styles.mono}>{fmtMoney(pk.cost)}</span>
                  <span
                    style={{
                      ...styles.mono,
                      marginLeft: 8,
                      color: keepValue >= 0 ? "#5fd685" : "#e46a5c",
                      minWidth: 56,
                      textAlign: "right",
                    }}
                    title="Modeled auction value minus keeper cost"
                  >
                    {keepValue >= 0 ? "+" : ""}
                    {fmtMoney(keepValue)}
                  </span>
                  <button style={styles.keepPromoteBtn} onClick={() => promoteToKeeper(idx)}>
                    Keep
                  </button>
                  <button style={styles.removeBtn} onClick={() => removePotentialKeeper(idx)} aria-label="Remove candidate">
                    ×
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </section>

      {/* Keepers */}
      <section style={{ ...styles.panel, marginTop: 16 }}>
        <div style={styles.panelTitle}>Keepers ({keepers.length})</div>
        <p style={{ color: "#7d8599", fontSize: 13, marginTop: -4, marginBottom: 10 }}>
          Enter every player already kept before the auction starts — they'll be pulled
          out of the pool and charged against that team's budget and roster spots.
        </p>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
          <div style={{ position: "relative", flex: "1 1 220px", minWidth: 200 }}>
            <input
              placeholder="Search player…"
              value={keeperQuery}
              onChange={(e) => {
                setKeeperQuery(e.target.value);
                setKeeperPlayerId(null);
              }}
              style={styles.nomInput}
            />
            {keeperQuery && keeperResults.length > 0 && keeperPlayerId === null && (
              <div style={styles.searchDropdown}>
                {keeperResults.map((p) => (
                  <div
                    key={p.id}
                    style={styles.searchResultRow}
                    onClick={() => {
                      setKeeperPlayerId(p.id);
                      setKeeperQuery(p.name);
                    }}
                  >
                    <PosPill pos={p.position} />
                    <span style={{ flex: 1 }}>{p.name}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <select
            value={keeperTeamId ?? ""}
            onChange={(e) => setKeeperTeamId(parseInt(e.target.value, 10))}
            style={styles.nomSelect}
          >
            {teams.map((t) => (
              <option key={t.id} value={t.id}>
                {t.name}
              </option>
            ))}
          </select>
          <input
            type="number"
            placeholder="Cost $"
            value={keeperCost}
            onChange={(e) => setKeeperCost(e.target.value)}
            style={{ ...styles.nomInput, maxWidth: 100, flex: "0 0 100px" }}
          />
          <button style={styles.primaryBtn} onClick={addKeeper}>
            Add keeper
          </button>
        </div>

        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
          <button style={styles.ghostBtnSm} onClick={() => keeperCsvInputRef.current?.click()}>
            Upload CSV of keepers
          </button>
          <input
            ref={keeperCsvInputRef}
            type="file"
            accept=".csv"
            style={{ display: "none" }}
            onChange={(e) => {
              const f = e.target.files?.[0];
              if (f) onBulkKeepers(f);
              e.target.value = "";
            }}
          />
          <span style={{ fontSize: 12, color: "#5f6779" }}>Columns: Player, Team, Cost</span>
        </div>
        {keeperUploadMsg && <div style={{ fontSize: 12.5, color: "#8b93a7", marginBottom: 8 }}>{keeperUploadMsg}</div>}
        {keeperError && <div style={styles.errorBox}>{keeperError}</div>}

        {keepers.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {keepers.map((k, idx) => {
              const p = players.find((pp) => pp.id === k.playerId);
              const t = teamById(k.teamId);
              return (
                <div key={idx} style={styles.keeperRow}>
                  <PosPill pos={p?.position} />
                  <span style={{ flex: 1, fontSize: 13, marginLeft: 8 }}>{p?.name}</span>
                  <span style={{ fontSize: 12.5, color: "#8b93a7", marginRight: 10 }}>{t?.name}</span>
                  <span style={styles.mono}>{fmtMoney(k.cost)}</span>
                  <button style={styles.removeBtn} onClick={() => removeKeeper(idx)} aria-label="Remove keeper">
                    ×
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </section>

      {/* Projections update */}
      <section style={{ ...styles.panel, marginTop: 16 }}>
        <div style={styles.panelTitle}>Update projections</div>
        <p style={{ color: "#7d8599", fontSize: 13, marginTop: -4, marginBottom: 10 }}>
          This fully replaces the player pool with your upload — export a CSV from the
          workbook with "Player", "Position", and "Points" columns (names need to match
          exactly, e.g. "Josh Allen BUF"). Names already in the pool get their points
          updated, new names get added, and anyone from the current pool who isn't in
          your file gets removed — except a player already drafted or kept, since
          dropping them mid-draft would break your rosters. Uploading recomputes VBD,
          tiers, auction values, and scarcity for the whole pool.
        </p>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <button style={styles.ghostBtnSm} onClick={() => projInputRef.current?.click()}>
            Choose CSV file
          </button>
          <input
            ref={projInputRef}
            type="file"
            accept=".csv"
            style={{ display: "none" }}
            onChange={(e) => {
              const f = e.target.files?.[0];
              if (f) onUpdateProjections(f);
              e.target.value = "";
            }}
          />
          {projMsg && <span style={{ fontSize: 12.5, color: "#8b93a7" }}>{projMsg}</span>}
        </div>
      </section>

      <div style={{ display: "flex", gap: 12, marginTop: 24, alignItems: "center", flexWrap: "wrap" }}>
        <button style={styles.primaryBtn} onClick={onStart}>
          {picksExist ? "Return to draft" : "Start the draft"}
        </button>
        {picksExist && (
          <button
            style={styles.dangerGhostBtn}
            onClick={() => {
              if (window.confirm("Clear all live draft picks and start over? Keepers, team names, and order stay.")) {
                onResetDraft();
              }
            }}
          >
            Reset live picks
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   DRAFT SCREEN
---------------------------------------------------------- */
function DraftScreen({
  teams,
  order,
  keepers,
  picks,
  setPicks,
  players,
  onEditSetup,
  onAddCustomPlayer,
  addPlayerMsg,
  myTeamId,
  setMyTeamId,
}) {
  const [view, setView] = useState("board"); // board | rosters
  const [posFilter, setPosFilter] = useState(() => new Set());
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState("auction");
  const [nomPlayerId, setNomPlayerId] = useState(null);
  const [nomTeamId, setNomTeamId] = useState(null);
  const [nomBid, setNomBid] = useState("");
  const [error, setError] = useState("");
  const [playerQuery, setPlayerQuery] = useState("");
  const [highlightIndex, setHighlightIndex] = useState(0);
  const teamSelectRef = useRef(null);
  const bidInputRef = useRef(null);
  const [showAddPlayer, setShowAddPlayer] = useState(false);
  const [addName, setAddName] = useState("");
  const [addPos, setAddPos] = useState("RB");

  const myTeamEntries = useMemo(() => {
    if (myTeamId === null) return [];
    return [...keepers.filter((k) => k.teamId === myTeamId), ...picks.filter((p) => p.teamId === myTeamId)];
  }, [myTeamId, keepers, picks]);

  const myTeamLineup = useMemo(() => {
    if (myTeamId === null) return null;
    return buildLineup(myTeamEntries, players, ROSTER_REQUIREMENTS);
  }, [myTeamId, myTeamEntries, players]);

  // Need multiplier: how much this team should prioritize a position right now,
  // based on which of their own roster slots are still open.
  const needMultiplier = (position) => {
    if (!myTeamLineup) return 1;
    const hardSlots = myTeamLineup.slots.filter(
      (s) => s.label.startsWith(position) && !s.label.startsWith("FLEX") && !s.label.startsWith("SFLX")
    );
    if (hardSlots.some((s) => !s.entry)) return 1.25;
    const flexEligible = SUPERFLEX_ELIGIBLE.includes(position);
    if (flexEligible) {
      const flexSlots = myTeamLineup.slots.filter((s) => s.label.startsWith("SFLX"));
      if (flexSlots.some((s) => !s.entry)) return 1.1;
    }
    const capacity = (ROSTER_REQUIREMENTS[position] || 0) + (flexEligible ? ROSTER_REQUIREMENTS.SUPERFLEX || 0 : 0);
    const countAtPos = myTeamEntries.filter((e) => {
      const p = players.find((pp) => pp.id === e.playerId);
      return p && p.position === position;
    }).length;
    if (countAtPos > capacity + 2) return 0.85;
    return 1;
  };

  const myBudgetLeft = useMemo(() => {
    if (myTeamId === null) return null;
    return BUDGET_PER_TEAM - myTeamEntries.reduce((s, e) => s + e.cost, 0);
  }, [myTeamId, myTeamEntries]);

  const myMaxAffordable = useMemo(() => {
    if (myTeamId === null) return null;
    const spotsLeft = ROSTER_SPOTS - myTeamEntries.length;
    if (spotsLeft <= 0) return 0;
    return myBudgetLeft - (spotsLeft - 1);
  }, [myTeamId, myTeamEntries, myBudgetLeft]);

  useEffect(() => {
    if (myTeamId !== null) setSortKey("personal");
  }, [myTeamId]);

  const draftedIds = useMemo(() => {
    const s = new Set(picks.map((p) => p.playerId));
    keepers.forEach((k) => s.add(k.playerId));
    return s;
  }, [picks, keepers]);

  const spentByTeam = useMemo(() => {
    const m = {};
    teams.forEach((t) => (m[t.id] = 0));
    keepers.forEach((k) => (m[k.teamId] = (m[k.teamId] || 0) + k.cost));
    picks.forEach((p) => (m[p.teamId] = (m[p.teamId] || 0) + p.cost));
    return m;
  }, [picks, keepers, teams]);

  const countByTeam = useMemo(() => {
    const m = {};
    teams.forEach((t) => (m[t.id] = 0));
    keepers.forEach((k) => (m[k.teamId] = (m[k.teamId] || 0) + 1));
    picks.forEach((p) => (m[p.teamId] = (m[p.teamId] || 0) + 1));
    return m;
  }, [picks, keepers, teams]);

  const budgetRemaining = (teamId) => BUDGET_PER_TEAM - (spentByTeam[teamId] || 0);
  const spotsRemaining = (teamId) => ROSTER_SPOTS - (countByTeam[teamId] || 0);
  const maxAffordableBid = (teamId) => {
    const spots = spotsRemaining(teamId);
    if (spots <= 0) return 0;
    return budgetRemaining(teamId) - (spots - 1);
  };

  const nominatorIdx = picks.length % order.length;
  const nominatorTeamId = order[nominatorIdx];
  const nominatorTeam = teams.find((t) => t.id === nominatorTeamId);

  useEffect(() => {
    if (nomTeamId === null) setNomTeamId(nominatorTeamId);
  }, [nominatorTeamId, nomTeamId]);

  const availablePlayers = useMemo(
    () => players.filter((p) => !draftedIds.has(p.id)),
    [draftedIds]
  );

  const boardPlayers = useMemo(() => {
    let list = availablePlayers;
    if (posFilter.size > 0) list = list.filter((p) => posFilter.has(p.position));
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter((p) => p.name.toLowerCase().includes(q));
    }
    // When a team is selected, enrich each row with need-adjusted numbers —
    // the underlying players array stays pure market data (used elsewhere,
    // e.g. Draft Analysis for every team), this is purely a display/sort layer.
    if (myTeamId !== null) {
      list = list.map((p) => {
        const mult = needMultiplier(p.position);
        const cap = myMaxAffordable === null ? Infinity : myMaxAffordable;
        const personalValue = Math.max(1, Math.min(Math.round(p.auctionValue * mult), cap));
        const personalMaxBid = Math.max(personalValue, Math.min(Math.round(p.maxBid * mult), cap));
        return { ...p, needMult: mult, personalScore: p.scarcity * mult, personalValue, personalMaxBid };
      });
    }
    const sorters = {
      scarcity: (a, b) => b.scarcity - a.scarcity,
      personal: (a, b) => b.personalScore - a.personalScore,
      auction: (a, b) => b.auctionValue - a.auctionValue,
      points: (a, b) => b.points - a.points,
      vbd: (a, b) => b.vbd - a.vbd,
      name: (a, b) => a.name.localeCompare(b.name),
    };
    return [...list].sort(sorters[sortKey] || sorters.auction);
  }, [availablePlayers, posFilter, search, sortKey, myTeamId, myMaxAffordable, myTeamLineup]);

  const togglePosition = (pos) => {
    setPosFilter((prev) => {
      const next = new Set(prev);
      if (next.has(pos)) next.delete(pos);
      else next.add(pos);
      return next;
    });
  };

  const toggleGroup = (group) => {
    setPosFilter((prev) => {
      const allIn = group.every((p) => prev.has(p));
      const next = new Set(prev);
      group.forEach((p) => (allIn ? next.delete(p) : next.add(p)));
      return next;
    });
  };


  const topByPosition = useMemo(() => {
    const out = {};
    POSITIONS.forEach((pos) => {
      out[pos] = availablePlayers
        .filter((p) => p.position === pos)
        .sort((a, b) => b.scarcity - a.scarcity)
        .slice(0, 3);
    });
    return out;
  }, [availablePlayers]);

  const playerSearchResults = useMemo(() => {
    if (!playerQuery.trim()) return [];
    const q = playerQuery.trim().toLowerCase();
    return availablePlayers
      .filter((p) => p.name.toLowerCase().includes(q))
      .slice(0, 8);
  }, [playerQuery, availablePlayers]);

  useEffect(() => {
    setHighlightIndex(0);
  }, [playerQuery]);

  const selectedNomPlayer = players.find((p) => p.id === nomPlayerId);

  const pickPlayer = (p) => {
    setNomPlayerId(p.id);
    setPlayerQuery(p.name);
    setError("");
  };

  const handleSearchKeyDown = (e) => {
    if (e.key === "ArrowDown") {
      if (playerSearchResults.length === 0) return;
      e.preventDefault();
      setHighlightIndex((i) => Math.min(i + 1, playerSearchResults.length - 1));
    } else if (e.key === "ArrowUp") {
      if (playerSearchResults.length === 0) return;
      e.preventDefault();
      setHighlightIndex((i) => Math.max(i - 1, 0));
    } else if (e.key === "Enter") {
      if (playerSearchResults.length > 0 && nomPlayerId === null) {
        e.preventDefault();
        const chosen = playerSearchResults[highlightIndex] || playerSearchResults[0];
        if (chosen) pickPlayer(chosen);
      }
    } else if (e.key === "Tab") {
      // Tab both selects the highlighted candidate AND moves on to the team
      // dropdown in one press — no need to hit Enter first, then Tab again.
      if (playerSearchResults.length > 0 && nomPlayerId === null) {
        e.preventDefault();
        const chosen = playerSearchResults[highlightIndex] || playerSearchResults[0];
        if (chosen) pickPlayer(chosen);
        teamSelectRef.current?.focus();
      }
    }
  };

  const submitPick = () => {
    setError("");
    if (nomPlayerId === null) {
      setError("Pick a player to nominate.");
      return;
    }
    if (draftedIds.has(nomPlayerId)) {
      setError("That player is already drafted.");
      return;
    }
    if (nomTeamId === null) {
      setError("Choose the winning team.");
      return;
    }
    const bid = parseInt(nomBid, 10);
    if (!Number.isFinite(bid) || bid < 1) {
      setError("Enter a winning bid of at least $1.");
      return;
    }
    if (spotsRemaining(nomTeamId) <= 0) {
      setError(`${teams.find((t) => t.id === nomTeamId)?.name}'s roster is already full (${ROSTER_SPOTS} spots).`);
      return;
    }
    const maxBid = maxAffordableBid(nomTeamId);
    if (bid > maxBid) {
      setError(
        `That's more than ${teams.find((t) => t.id === nomTeamId)?.name} can bid — max is ${fmtMoney(
          maxBid
        )} (must leave $1 for each remaining roster spot).`
      );
      return;
    }
    const newPick = {
      playerId: nomPlayerId,
      teamId: nomTeamId,
      cost: bid,
      pickNum: picks.length + 1,
    };
    setPicks([...picks, newPick]);
    setNomPlayerId(null);
    setPlayerQuery("");
    setNomBid("");
    setNomTeamId(order[(picks.length + 1) % order.length]);
  };

  const undoLast = () => {
    if (picks.length === 0) return;
    setPicks(picks.slice(0, -1));
  };

  const recentPicks = [...picks].slice(-order.length).reverse();

  return (
    <div style={styles.draftWrap}>
      {/* Top bar */}
      <div style={styles.topBar}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
          <div style={styles.eyebrowSmall}>DYNASTY DRAFT</div>
          <div style={{ fontSize: 13, color: "#8b93a7" }}>
            Pick {picks.length + 1} · {teams.length} teams · ${BUDGET_PER_TEAM} cap
            {keepers.length > 0 ? ` · ${keepers.length} keeper${keepers.length === 1 ? "" : "s"} locked in` : ""}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={styles.ghostBtnSm} onClick={undoLast} disabled={picks.length === 0}>
            Undo last pick
          </button>
          <button style={styles.ghostBtnSm} onClick={onEditSetup}>
            Edit setup
          </button>
        </div>
      </div>

      <div style={styles.myTeamBar}>
        <span style={{ fontSize: 12.5, color: "#8b93a7", fontWeight: 600 }}>My team:</span>
        <select
          value={myTeamId ?? ""}
          onChange={(e) => setMyTeamId(e.target.value === "" ? null : parseInt(e.target.value, 10))}
          style={styles.nomSelect}
        >
          <option value="">— Not set —</option>
          {teams.map((t) => (
            <option key={t.id} value={t.id}>
              {t.name}
            </option>
          ))}
        </select>
        {myTeamId !== null && (
          <span style={{ fontSize: 12.5, color: "#7d8599" }}>
            Board's sorted and priced for your remaining needs — {fmtMoney(myBudgetLeft)} left,{" "}
            {ROSTER_SPOTS - myTeamEntries.length} spots to fill.
          </span>
        )}
      </div>

      {/* On the clock */}
      <div className="clock-bar" style={styles.clockBar}>
        <div>
          <div style={{ fontSize: 12, color: "#7d8599", letterSpacing: 0.5, textTransform: "uppercase" }}>
            On the clock to nominate
          </div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#f4c95d" }}>{nominatorTeam?.name}</div>
        </div>
        <div className="clock-stats" style={styles.clockStats}>
          <ClockStat label="Budget left" value={fmtMoney(budgetRemaining(nominatorTeamId))} />
          <ClockStat label="Spots left" value={spotsRemaining(nominatorTeamId)} />
          <ClockStat label="Max bid" value={fmtMoney(Math.max(0, maxAffordableBid(nominatorTeamId)))} />
        </div>
      </div>

      {/* Ticker */}
      {recentPicks.length > 0 && <Ticker picks={picks} players={players} teams={teams} limit={order.length} />}

      {/* Nomination panel */}
      <div style={styles.nomPanel}>
        <div style={{ position: "relative", flex: "1 1 240px", minWidth: 220 }}>
          <input
            placeholder="Search player to nominate…"
            value={playerQuery}
            onChange={(e) => {
              setPlayerQuery(e.target.value);
              setNomPlayerId(null);
            }}
            onKeyDown={handleSearchKeyDown}
            style={styles.nomInput}
          />
          {playerQuery && playerSearchResults.length > 0 && nomPlayerId === null && (
            <div style={styles.searchDropdown}>
              {playerSearchResults.map((p, idx) => (
                <div
                  key={p.id}
                  style={{
                    ...styles.searchResultRow,
                    background: idx === highlightIndex ? "rgba(224,179,74,0.16)" : undefined,
                  }}
                  onMouseEnter={() => setHighlightIndex(idx)}
                  onClick={() => pickPlayer(p)}
                >
                  <PosPill pos={p.position} />
                  <span style={{ flex: 1 }}>{p.name}</span>
                  <span style={{ color: "#8b93a7", fontSize: 12 }}>Val {fmtMoney(p.auctionValue)}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <select
          ref={teamSelectRef}
          value={nomTeamId ?? ""}
          onChange={(e) => {
            setNomTeamId(parseInt(e.target.value, 10));
          }}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              bidInputRef.current?.focus();
            }
          }}
          style={styles.nomSelect}
        >
          {teams.map((t) => (
            <option key={t.id} value={t.id}>
              {t.name} ({fmtMoney(budgetRemaining(t.id))})
            </option>
          ))}
        </select>

        <input
          ref={bidInputRef}
          type="number"
          placeholder="Winning bid $"
          value={nomBid}
          onChange={(e) => setNomBid(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              submitPick();
            }
          }}
          style={{ ...styles.nomInput, maxWidth: 130, flex: "0 0 130px" }}
        />

        <button style={styles.primaryBtn} onClick={submitPick}>
          Log pick
        </button>
      </div>
      {selectedNomPlayer && (
        <div style={{ fontSize: 13, color: "#8b93a7", marginTop: -8, marginBottom: 4 }}>
          Nominating <b style={{ color: "#e7ebf3" }}>{selectedNomPlayer.name}</b> ·{" "}
          suggested max bid {fmtMoney(selectedNomPlayer.maxBid)}
        </div>
      )}
      {error && <div style={styles.errorBox}>{error}</div>}

      <div style={{ marginBottom: 14 }}>
        <button style={styles.ghostBtnSm} onClick={() => setShowAddPlayer((v) => !v)}>
          {showAddPlayer ? "Cancel" : "+ Add player not in the list"}

function DraftAnalysisView({ teams, order, keepers, picks, players }) {
  const [sortCol, setSortCol] = useState("starterRank");
  const [sortDir, setSortDir] = useState("asc");

  const rows = useMemo(() => {
    return order.map((teamId) => {
      const t = teams.find((tt) => tt.id === teamId);
      const combined = [
        ...keepers.filter((k) => k.teamId === teamId),
        ...picks.filter((p) => p.teamId === teamId),
      ];
      const playerCount = combined.length;
      let projPoints = 0;
      let auctionValue = 0;
      combined.forEach((pk) => {
        const p = players.find((pp) => pp.id === pk.playerId);
        if (p) {
          projPoints += p.points;
          auctionValue += p.auctionValue;
        }
      });
      const { starterPoints } = buildLineup(combined, players, ROSTER_REQUIREMENTS);
      const actualCost = combined.reduce((s, pk) => s + pk.cost, 0);
      const draftValue = auctionValue - actualCost;
      const powerScore = projPoints * 0.8 + draftValue * 0.2;
      const budgetEff = actualCost === 0 ? 0 : auctionValue / actualCost;
      const avgCost = playerCount === 0 ? 0 : actualCost / playerCount;
      const avgProj = playerCount === 0 ? 0 : projPoints / playerCount;
      return {
        teamId,
        name: t?.name,
        playerCount,
        projPoints,
        starterPoints,
        auctionValue,
        actualCost,
        draftValue,
        powerScore,
        budgetEff,
        avgCost,
        avgProj,
      };
    });
  }, [teams, order, keepers, picks, players]);

  const hasAny = rows.some((r) => r.playerCount > 0);

  if (!hasAny) {
    return (
      <div style={{ color: "#7d8599", padding: "24px 4px", fontSize: 13 }}>
        No keepers or picks logged yet — analysis fills in as the draft happens.
      </div>
    );
  }

  const pointsRankMap = {};
  [...rows].sort((a, b) => b.projPoints - a.projPoints).forEach((r, i) => (pointsRankMap[r.teamId] = i + 1));

  const starterRankMap = {};
  [...rows]
    .sort((a, b) => b.starterPoints - a.starterPoints)
    .forEach((r, i) => (starterRankMap[r.teamId] = i + 1));

  const powerRankMap = {};
  [...rows].sort((a, b) => b.powerScore - a.powerScore).forEach((r, i) => (powerRankMap[r.teamId] = i + 1));

  const withRanks = rows.map((r) => ({
    ...r,
    pointsRank: pointsRankMap[r.teamId],
    starterRank: starterRankMap[r.teamId],
    powerRank: powerRankMap[r.teamId],
  }));

  const columns = [
    { key: "name", label: "Team", tip: "The team this row summarizes." },
    { key: "playerCount", label: "Players", tip: "Total players drafted or kept so far." },
    {
      key: "starterPoints",
      label: "Starter Pts",
      fmt: (v) => v.toFixed(1),
      tip: "Total projected points from only the players in this team's starting lineup — bench production is excluded.",
    },
    {
      key: "starterRank",
      label: "Starter Rank",
      fmt: (v) => "#" + v,
      tip: "Rank among all teams by Starter Pts — the best gauge of who's actually built the strongest active roster.",
    },
    {
      key: "projPoints",
      label: "Proj Pts",
      fmt: (v) => v.toFixed(1),
      tip: "Total projected points across every drafted/kept player, starters and bench combined.",
    },
    {
      key: "pointsRank",
      label: "Pts Rank",
      fmt: (v) => "#" + v,
      tip: "Rank among all teams by total Proj Pts (starters + bench).",
    },
    {
      key: "auctionValue",
      label: "Auction Val",
      fmt: fmtMoney,
      tip: "The modeled pre-draft dollar value of every player this team owns, summed — what the model thought they were worth.",
    },
    {
      key: "actualCost",
      label: "Actual Cost",
      fmt: fmtMoney,
      tip: "What this team actually paid in total, across keepers and live picks.",
    },
    {
      key: "draftValue",
      label: "Draft Value",
      fmt: fmtMoney,
      signed: true,
      tip: "Auction Val minus Actual Cost — positive means this team found bargains overall, negative means they paid a premium overall.",
    },
    {
      key: "powerRank",
      label: "Power Rank",
      fmt: (v) => "#" + v,
      tip: "Rank blending total projected points (80%) with Draft Value (20%) — rewards strong rosters built efficiently.",
    },
    {
      key: "budgetEff",
      label: "Budget Eff.",
      fmt: (v) => v.toFixed(2) + "x",
      tip: "Auction Val divided by Actual Cost — above 1x means this team got more modeled value than they paid for, on average.",
    },
    {
      key: "avgCost",
      label: "Avg $/Plyr",
      fmt: fmtMoney,
      tip: "Actual Cost divided by number of players — average price paid per roster spot.",
    },
    {
      key: "avgProj",
      label: "Avg Pts/Plyr",
      fmt: (v) => v.toFixed(1),
      tip: "Proj Pts divided by number of players — a quick read on average roster quality regardless of roster size.",
    },
  ];

  const rankLikeAsc = new Set(["name", "starterRank", "pointsRank", "powerRank"]);

  const handleSort = (key) => {
    if (sortCol === key) {
      setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    } else {
      setSortCol(key);
      setSortDir(rankLikeAsc.has(key) ? "asc" : "desc");
    }
  };

  const sortedRows = [...withRanks].sort((a, b) => {
    const av = a[sortCol];
    const bv = b[sortCol];
    if (typeof av === "string") {
      return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    return sortDir === "asc" ? av - bv : bv - av;
  });

  return (
    <div>
      <p style={{ color: "#7d8599", fontSize: 13, marginTop: -4, marginBottom: 10 }}>
        Starter Pts counts only the players in each team's starting lineup (see Team
        Rosters) — bench production is excluded. Power Rank blends total projected
        points (80%) with draft value — auction value minus what was actually paid
        (20%) — the same formula as the workbook's Post_Draft_Analysis sheet. Click
        any column to sort.
      </p>
      <div style={styles.tableWrap}>
        <table style={styles.table}>
          <thead>
            <tr>
              {columns.map((c) => (
                <th
                  key={c.key}
                  style={{ ...(c.key === "name" ? styles.th : styles.thNum), cursor: "pointer", userSelect: "none" }}
                  onClick={() => handleSort(c.key)}
                  title={c.tip}
                >
                  {c.label}
                  {sortCol === c.key ? (sortDir === "asc" ? " ▲" : " ▼") : ""}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sortedRows.map((r) => (
              <tr key={r.teamId} style={{ ...styles.tr, cursor: "default" }}>
                {columns.map((c) => {
                  const raw = r[c.key];
                  const display = c.fmt ? c.fmt(raw) : raw;
                  const color = c.signed ? (raw >= 0 ? "#5fd685" : "#e46a5c") : undefined;
                  return (
                    <td key={c.key} style={c.key === "name" ? styles.tdName : { ...styles.tdNum, color }}>
                      {c.signed && raw >= 0 ? "+" : ""}
                      {display}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

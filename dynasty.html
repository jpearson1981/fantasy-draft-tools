                  </td>
                  <td style={styles.boardTd}>{t?.name}</td>
                  <td style={{ ...styles.boardTd, fontVariantNumeric: "tabular-nums" }}>{fmtMoney(k.cost)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LessonsLearnedView({ teams, order, keepers, picks, players, myTeamId }) {
  const rows = useMemo(() => {
    return order.map((teamId) => {
      const t = teams.find((tt) => tt.id === teamId);
      const combined = [
        ...keepers.filter((k) => k.teamId === teamId),
        ...picks.filter((p) => p.teamId === teamId),
      ];
      const { starterPoints } = buildLineup(combined, players, ROSTER_REQUIREMENTS);
      let auctionValue = 0;
      let actualCost = 0;
      combined.forEach((pk) => {
        const p = players.find((pp) => pp.id === pk.playerId);
        if (p) auctionValue += p.auctionValue;
        actualCost += pk.cost;
      });
      return {
        teamId,
        name: t?.name,
        starterPoints,
        playerCount: combined.length,
        draftValue: auctionValue - actualCost,
      };
    });
  }, [teams, order, keepers, picks, players]);

  if (keepers.length === 0 && picks.length === 0) {
    return (
      <div style={{ color: "#7d8599", padding: "24px 4px", fontSize: 13 }}>
        Lessons and trends will fill in once the draft happens.
      </div>
    );
  }

  const starterRankMap = {};
  [...rows].sort((a, b) => b.starterPoints - a.starterPoints).forEach((r, i) => (starterRankMap[r.teamId] = i + 1));
  const valueRankMap = {};
  [...rows].sort((a, b) => b.draftValue - a.draftValue).forEach((r, i) => (valueRankMap[r.teamId] = i + 1));

  const myRow = myTeamId !== null ? rows.find((r) => r.teamId === myTeamId) : null;
  const myStarterRank = myRow ? starterRankMap[myRow.teamId] : null;
  const myValueRank = myRow ? valueRankMap[myRow.teamId] : null;

  const posTrend = {};
  [...keepers, ...picks].forEach((pk) => {
    const p = players.find((pp) => pp.id === pk.playerId);
    if (!p) return;
    if (!posTrend[p.position]) posTrend[p.position] = { sum: 0, count: 0 };
    posTrend[p.position].sum += pk.cost;
    posTrend[p.position].count += 1;
  });
  const posTrendSorted = Object.entries(posTrend)
    .map(([pos, d]) => ({ pos, avgCost: d.sum / d.count, count: d.count }))
    .sort((a, b) => b.avgCost - a.avgCost);

  let myPosBreakdown = null;
  if (myRow) {
    const leaguePos = {};
    const myPos = {};
    order.forEach((tid) => {
      [...keepers.filter((k) => k.teamId === tid), ...picks.filter((p) => p.teamId === tid)].forEach((pk) => {
        const p = players.find((pp) => pp.id === pk.playerId);
        if (!p) return;
        leaguePos[p.position] = (leaguePos[p.position] || 0) + pk.cost;
        if (tid === myTeamId) myPos[p.position] = (myPos[p.position] || 0) + pk.cost;
      });
    });
    myPosBreakdown = POSITIONS.map((pos) => {
      const leagueAvgPerTeam = (leaguePos[pos] || 0) / order.length;
      const mine = myPos[pos] || 0;
      return { pos, mine, leagueAvgPerTeam, diff: mine - leagueAvgPerTeam };
    });
  }

  const tips = [];
  if (myRow) {
    const third = Math.ceil(order.length / 3);
    if (myStarterRank <= third) {
      tips.push(
        `Your starting lineup ranked #${myStarterRank} of ${order.length} — one of the strongest rosters in the league. Whatever approach got you here is worth repeating.`
      );
    } else if (myStarterRank > order.length - third) {
      tips.push(
        `Your starting lineup ranked #${myStarterRank} of ${order.length} — near the bottom of the league. The position breakdown below points at where you fell behind.`
      );
    } else {
      tips.push(`Your starting lineup ranked #${myStarterRank} of ${order.length} — solidly middle of the pack.`);
    }
    tips.push(
      `Your Draft Value was ${fmtMoney(myRow.draftValue)} ${
        myRow.draftValue >= 0 ? "in bargains found" : "spent above modeled value"
      } — ranked #${myValueRank} of ${order.length} in the league for value found relative to what was paid.`
    );
    if (myPosBreakdown) {
      const sorted = [...myPosBreakdown].sort((a, b) => a.diff - b.diff);
      const under = sorted[0];
      const over = sorted[sorted.length - 1];
      if (under && under.diff < -10) {
        tips.push(
          `${under.pos} was where you spent the least relative to the rest of the league — worth budgeting more there next year if that position came up short.`
        );
      }
      if (over && over.diff > 10) {
        tips.push(
          `${over.pos} is where you invested the most relative to the league — make sure that spending actually paid off in points, not just name value.`
        );
      }
    }
  } else {
    tips.push(`Pick "My team" on the Draft screen next time to get a personalized breakdown here.`);
  }
  if (posTrendSorted.length > 0) {
    const priciest = posTrendSorted[0];
    const cheapest = posTrendSorted[posTrendSorted.length - 1];
    tips.push(
      `${priciest.pos} commanded the highest average price this draft (${fmtMoney(
        priciest.avgCost
      )}) — budget for a premium there next year.`
    );
    tips.push(
      `${cheapest.pos} went for the least on average (${fmtMoney(
        cheapest.avgCost
      )}) — a reasonable position to wait on if money's tight elsewhere.`
    );
  }
  tips.push(
    `This draft's actual keeper and auction prices have already been folded into next year's calibrated values and Max Bids — no separate action needed there.`
  );

  return (
    <div>
      {myRow && (
        <div style={{ ...styles.panel, marginBottom: 16 }}>
          <div style={styles.panelTitle}>Your draft, in short</div>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            <ClockStat label="Starter Rank" value={`#${myStarterRank} / ${order.length}`} />
            <ClockStat label="Draft Value" value={fmtMoney(myRow.draftValue)} />
            <ClockStat label="Players" value={myRow.playerCount} />
          </div>
        </div>
      )}

      <div style={{ ...styles.panel, marginBottom: 16 }}>
        <div style={styles.panelTitle}>Positional spending trends this draft</div>
        <p style={{ color: "#7d8599", fontSize: 12.5, marginTop: -4, marginBottom: 8 }}>
          Average price paid by position, across every team this draft (keepers and live picks).
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {posTrendSorted.map((pt) => (
            <div key={pt.pos} style={styles.recRow}>
              <PosPill pos={pt.pos} />
              <span style={{ flex: 1, marginLeft: 8 }}>{pt.pos}</span>
              <span style={styles.mono}>avg {fmtMoney(pt.avgCost)}</span>
            </div>
          ))}
        </div>
      </div>

      {myPosBreakdown && (
        <div style={{ ...styles.panel, marginBottom: 16 }}>
          <div style={styles.panelTitle}>Your position spending vs. league average</div>
          <div style={styles.tableWrap}>
            <table style={styles.table}>
              <thead>
                <tr>
                  <th style={styles.th}>Pos</th>
                  <th style={styles.thNum} title="Total amount you spent (keepers + picks) at this position">
                    Your Spend
                  </th>
                  <th style={styles.thNum} title="Average total spend at this position, across all teams">
                    League Avg/Team
                  </th>
                  <th style={styles.thNum} title="Yours minus the league average — positive means you spent more here than most">
                    Difference
                  </th>
                </tr>
              </thead>
              <tbody>
                {myPosBreakdown.map((r) => (
                  <tr key={r.pos} style={{ ...styles.tr, cursor: "default" }}>
                    <td style={styles.td}>
                      <PosPill pos={r.pos} />
                    </td>
                    <td style={styles.tdNum}>{fmtMoney(r.mine)}</td>
                    <td style={styles.tdNum}>{fmtMoney(r.leagueAvgPerTeam)}</td>
                    <td style={{ ...styles.tdNum, color: r.diff >= 0 ? "#5fd685" : "#e46a5c" }}>
                      {r.diff >= 0 ? "+" : ""}
                      {fmtMoney(r.diff)}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Tips for next year</div>
        <ul style={{ margin: 0, paddingLeft: 18, display: "flex", flexDirection: "column", gap: 8 }}>
          {tips.map((tip, i) => (
            <li key={i} style={{ fontSize: 13.5, color: "#c7cede", lineHeight: 1.5 }}>
              {tip}
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}
